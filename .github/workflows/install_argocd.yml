name: Install ArgoCD

on:
  workflow_run:
    workflows:
      - Install k3s
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-argocd:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.terraformrc
      TF_WORKSPACE: "argocd-prod"
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: latest

      - name: Install kubeseal
        run: |
          curl -OL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.29.0/kubeseal-0.29.0-linux-amd64.tar.gz"
          tar -xvzf kubeseal-0.29.0-linux-amd64.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      # Add this step to create the Terraform Cloud workspace
      - name: Ensure Terraform Cloud workspace exists and set to local execution
        run: |
          echo "Checking or creating workspace: ${TF_WORKSPACE}"

          # Create the workspace if it doesn't exist
          PAYLOAD=$(cat <<EOF
          {
            "data": {
              "attributes": {
                "name": "${TF_WORKSPACE}",
                "auto-apply": true
              },
              "type": "workspaces"
            }
          }
          EOF
          )

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TF_TOKEN_app_terraform_io}" \
            -H "Content-Type: application/vnd.api+json" \
            -d "$PAYLOAD" \
            https://app.terraform.io/api/v2/organizations/${TF_CLOUD_ORGANIZATION}/workspaces)

          if [[ "$RESPONSE" == "201" ]]; then
            echo "✅ Workspace ${TF_WORKSPACE} created."
          elif [[ "$RESPONSE" == "422" ]]; then
            echo "ℹ️  Workspace ${TF_WORKSPACE} already exists."
          else
            echo "❌ Unexpected response from Terraform Cloud API: HTTP $RESPONSE"
            exit 1
          fi

          # Get the workspace ID
          WORKSPACE_ID=$(curl -s \
            -H "Authorization: Bearer ${TF_TOKEN_app_terraform_io}" \
            -H "Content-Type: application/vnd.api+json" \
            https://app.terraform.io/api/v2/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE} | jq -r '.data.id')

          echo "Workspace ID: $WORKSPACE_ID"

          # Set the workspace to use local execution mode
          PATCH_PAYLOAD=$(cat <<EOF
          {
            "data": {
              "type": "workspaces",
              "attributes": {
                "execution-mode": "local"
              }
            }
          }
          EOF
          )

          PATCH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${TF_TOKEN_app_terraform_io}" \
            -H "Content-Type: application/vnd.api+json" \
            -d "$PATCH_PAYLOAD" \
            https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID})

          if [[ "$PATCH_RESPONSE" == "200" ]]; then
            echo "✅ Workspace execution mode set to local."
          else
            echo "❌ Failed to set execution mode: HTTP $PATCH_RESPONSE"
            exit 1
          fi

      - name: Configure Terraform local execution
        working-directory: deploy/terraform/argocd
        run: |
          cat <<EOF > ${{ github.workspace }}/.terraformrc
          credentials "app.terraform.io" {
            token = "${TF_TOKEN_app_terraform_io}"
          }
          EOF
          
      - name: Set external IP
        run: |
          if [ "${ACT}" = "true" ]; then
            echo "EXTERNAL_IP=$(curl -s ifconfig.co -4)" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
          else
            echo "EXTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_INTERNAL_ADDRESS }}" >> "$GITHUB_ENV"
          fi

      - name: Generate auto.tfvars from secrets
        working-directory: deploy/terraform/argocd
        run: |
          cat <<EOF > github.auto.tfvars
          ssh_username                = "${{ secrets.SSH_USERNAME }}"
          ssh_server_address          = "${{ secrets.SSH_SERVER_ADDRESS }}"
          ssh_server_port             = "${{ secrets.SSH_SERVER_PORT }}"
          ssh_private_key             = "${{ secrets.SSH_PRIVATE_KEY }}"
          internal_ip                 = "${{ env.INTERNAL_IP }}"
          external_ip                 = "${{ env.EXTERNAL_IP }}"
          hostname                    = "${{ secrets.HOSTNAME }}"
          kubeconfig_content          = "${{ secrets.KUBECONFIG }}"
          argocd_deploy_private_key   = "${{ secrets.ARGOCD_DEPLOY_PRIVATE_KEY }}"
          argocd_repo_name            = "${{ github.repository }}"
          EOF


      - name: Start SSH tunnel to k3s API
        working-directory: deploy/terraform/argocd
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > /tmp/id_ed25519
          chmod 600 /tmp/id_ed25519
          nohup ssh -o StrictHostKeyChecking=no -i /tmp/id_ed25519 -N -L 127.0.0.1:6443:${{ env.INTERNAL_IP }}:6443 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER_ADDRESS }} -p ${{ secrets.SSH_SERVER_PORT }} > /dev/null 2>&1 &
          echo $! > ssh_tunnel.pid

      - name: Write kubeconfig.yaml from secret
        working-directory: deploy/terraform/argocd
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|' kubeconfig.yaml

      - name: Terraform Init
        working-directory: deploy/terraform/argocd
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: deploy/terraform/argocd
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: deploy/terraform/argocd
        run: terraform apply -auto-approve -input=false

      - name: Stop SSH tunnel
        working-directory: deploy/terraform/argocd
        if: always()
        run: |
          if [ -f ssh_tunnel.pid ]; then
            kill $(cat ssh_tunnel.pid) || true
            rm -f ssh_tunnel.pid
          fi