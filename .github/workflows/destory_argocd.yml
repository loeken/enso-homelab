name: Destroy ArgoCD Infrastructure

on:
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: read

jobs:
  destroy-argocd:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      TF_WORKSPACE: "argocd-prod" # Hardcoded workspace name
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.terraformrc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: .github/scripts/validate-secrets.sh
        shell: bash
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_SERVER_ADDRESS: ${{ secrets.SSH_SERVER_ADDRESS }}
          SSH_INTERNAL_ADDRESS: ${{ secrets.SSH_INTERNAL_ADDRESS }}
          SSH_SERVER_PORT: ${{ secrets.SSH_SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          HOSTNAME: ${{ secrets.HOSTNAME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: latest

      - name: Configure Terraform local execution
        working-directory: deploy/terraform/argocd
        run: |
          cat <<EOF > ${{ github.workspace }}/.terraformrc
          credentials "app.terraform.io" {
            token = "${TF_TOKEN_app_terraform_io}"
          }
          EOF

      - name: Generate auto.tfvars from secrets
        working-directory: deploy/terraform/argocd
        run: |
          cat <<EOF > github.auto.tfvars
          ssh_username        = "${{ secrets.SSH_USERNAME }}"
          ssh_server_address  = "${{ secrets.SSH_SERVER_ADDRESS }}"
          ssh_server_port     = "${{ secrets.SSH_SERVER_PORT }}"
          ssh_private_key     = "${{ secrets.SSH_PRIVATE_KEY }}"
          internal_ip         = "${{ secrets.INTERNAL_IP }}"
          external_ip         = "${{ secrets.EXTERNAL_IP }}"
          hostname            = "${{ secrets.HOSTNAME }}"
          kubeconfig_content  = "${{ secrets.KUBECONFIG_CONTENT }}"
          EOF

      - name: Terraform Init
        working-directory: deploy/terraform/argocd
        run: terraform init -input=false

      - name: Terraform Plan Destroy
        working-directory: deploy/terraform/argocd
        run: terraform plan -destroy -input=false

      - name: Terraform Destroy
        working-directory: deploy/terraform/argocd
        run: terraform destroy -auto-approve -input=false

      - name: Cleanup Terraform State
        working-directory: deploy/terraform/argocd
        run: |
          echo "Cleaning up Terraform state files..."
          rm -rf .terraform
          rm -f .terraform.lock.hcl
          rm -f terraform.tfstate
          rm -f terraform.tfstate.backup

      - name: Remove kubeconfig Secret
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          echo "Removing KUBECONFIG secret..."
          gh secret remove KUBECONFIG || echo "KUBECONFIG secret not found, skipping."