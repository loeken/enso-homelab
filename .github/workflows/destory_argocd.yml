name: Destroy ArgoCD

on:
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: read

jobs:
  destroy-argocd:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      TF_WORKSPACE: "argocd-prod" # Hardcoded workspace name
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.terraformrc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Validate required secrets
        run: .github/scripts/validate-secrets.sh
        shell: bash
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_SERVER_ADDRESS: ${{ secrets.SSH_SERVER_ADDRESS }}
          SSH_INTERNAL_ADDRESS: ${{ secrets.SSH_INTERNAL_ADDRESS }}
          SSH_SERVER_PORT: ${{ secrets.SSH_SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          HOSTNAME: ${{ secrets.HOSTNAME }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: latest

      - name: Configure Terraform local execution
        working-directory: deploy/terraform/argocd
        run: |
          cat <<EOF > ${{ github.workspace }}/.terraformrc
          credentials "app.terraform.io" {
            token = "${TF_TOKEN_app_terraform_io}"
          }
          EOF
          
      - name: Set external IP
        run: |
          if [ "${ACT}" = "true" ]; then
            echo "EXTERNAL_IP=$(curl -s ifconfig.co -4)" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
          else
            echo "EXTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_INTERNAL_ADDRESS }}" >> "$GITHUB_ENV"
          fi

      - name: Generate auto.tfvars from secrets
        working-directory: deploy/terraform/argocd
        run: |
          cat <<EOF > github.auto.tfvars
          ssh_username        = "${{ secrets.SSH_USERNAME }}"
          ssh_server_address  = "${{ secrets.SSH_SERVER_ADDRESS }}"
          ssh_server_port     = "${{ secrets.SSH_SERVER_PORT }}"
          ssh_private_key     = "${{ secrets.SSH_PRIVATE_KEY }}"
          internal_ip         = "${{ secrets.INTERNAL_IP }}"
          external_ip         = "${{ secrets.EXTERNAL_IP }}"
          hostname            = "${{ secrets.HOSTNAME }}"
          kubeconfig_content  = "${{ secrets.KUBECONFIG }}"
          argocd_deploy_private_key   = "${{ secrets.ARGOCD_DEPLOY_PRIVATE_KEY }}"
          argocd_repo_name            = "${{ github.repository }}"
          EOF

      - name: Start SSH tunnel to k3s API
        working-directory: deploy/terraform/argocd
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > /tmp/id_ed25519
          chmod 600 /tmp/id_ed25519
          nohup ssh -o StrictHostKeyChecking=no -i /tmp/id_ed25519 -N -L 127.0.0.1:6443:${{ env.INTERNAL_IP }}:6443 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER_ADDRESS }} -p ${{ secrets.SSH_SERVER_PORT }} > /dev/null 2>&1 &
          echo $! > ssh_tunnel.pid

      - name: Write kubeconfig.yaml from secret
        working-directory: deploy/terraform/argocd
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|' kubeconfig.yaml

      - name: Port-forward to ArgoCD and disable syncs
        working-directory: deploy/terraform/argocd
        env:
          KUBECONFIG: ${{ github.workspace }}/deploy/terraform/argocd/kubeconfig.yaml
        run: |
          # Install kubectl and argocd CLI if not present
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi
          if ! command -v argocd &> /dev/null; then
            curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x /usr/local/bin/argocd
          fi

          # Port-forward ArgoCD API server in background
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &
          PF_PID=$!
          sleep 5

          # Get ArgoCD admin password from secret
          ARGOCD_PWD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)

          # Login to ArgoCD CLI
          argocd login localhost:8080 --username admin --password "$ARGOCD_PWD" --insecure

          # Disable auto-sync for all apps
          for app in $(argocd app list -o name); do
            argocd app set "$app" --sync-policy none
          done

          # Kill port-forward
          kill $PF_PID

      - name: Terraform Init
        working-directory: deploy/terraform/argocd
        run: terraform init -input=false

      - name: Terraform Plan Destroy
        working-directory: deploy/terraform/argocd
        run: terraform plan -destroy -input=false

      - name: Terraform Destroy
        working-directory: deploy/terraform/argocd
        run: terraform destroy -auto-approve -input=false

      - name: Stop SSH tunnel
        working-directory: deploy/terraform/argocd
        if: always()
        run: |
          if [ -f ssh_tunnel.pid ]; then
            kill $(cat ssh_tunnel.pid) || true
            rm -f ssh_tunnel.pid
          fi

      - name: Cleanup Terraform State
        working-directory: deploy/terraform/argocd
        run: |
          echo "Cleaning up Terraform state files..."
          rm -rf .terraform
          rm -f .terraform.lock.hcl
          rm -f terraform.tfstate
          rm -f terraform.tfstate.backup
