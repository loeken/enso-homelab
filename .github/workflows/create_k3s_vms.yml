name: Create K3s VMs

on:
  workflow_dispatch:

jobs:
  create-k3s-vms:
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: kvms
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Set external IP
        run: |
          if [ "${ACT}" = "true" ]; then
            echo "EXTERNAL_IP=$(curl -s ifconfig.co -4)" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
          else
            echo "EXTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_INTERNAL_ADDRESS }}" >> "$GITHUB_ENV"
          fi

      - name: Ensure Terraform Cloud workspace 'kvms' exists and set to local execution
        run: |
          export TF_WORKSPACE="kvms"
          echo "Checking or creating workspace: ${TF_WORKSPACE}"

          PAYLOAD=$(cat <<EOF
          {
            "data": {
              "attributes": {
                "name": "${TF_WORKSPACE}",
                "auto-apply": true
              },
              "type": "workspaces"
            }
          }
          EOF
          )

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TF_TOKEN_app_terraform_io}" \
            -H "Content-Type: application/vnd.api+json" \
            -d "$PAYLOAD" \
            https://app.terraform.io/api/v2/organizations/${TF_CLOUD_ORGANIZATION}/workspaces)

          if [[ "$RESPONSE" == "201" ]]; then
            echo "✅ Workspace ${TF_WORKSPACE} created."
          elif [[ "$RESPONSE" == "422" ]]; then
            echo "ℹ️  Workspace ${TF_WORKSPACE} already exists."
          else
            echo "❌ Unexpected response from Terraform Cloud API: HTTP $RESPONSE"
            exit 1
          fi

          WORKSPACE_ID=$(curl -s \
            -H "Authorization: Bearer ${TF_TOKEN_app_terraform_io}" \
            -H "Content-Type: application/vnd.api+json" \
            https://app.terraform.io/api/v2/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE} | jq -r '.data.id')

          echo "Workspace ID: $WORKSPACE_ID"

          PATCH_PAYLOAD=$(cat <<EOF
          {
            "data": {
              "type": "workspaces",
              "attributes": {
                "execution-mode": "local"
              }
            }
          }
          EOF
          )

          PATCH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${TF_TOKEN_app_terraform_io}" \
            -H "Content-Type: application/vnd.api+json" \
            -d "$PATCH_PAYLOAD" \
            https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID})

          if [[ "$PATCH_RESPONSE" == "200" ]]; then
            echo "✅ Workspace execution mode set to local."
          else
            echo "❌ Failed to set execution mode: HTTP $PATCH_RESPONSE"
            exit 1
          fi

      - name: Configure Terraform local execution
        working-directory: deploy/terraform/k3s-proxmox
        run: |
          cat <<EOF > ${{ github.workspace }}/.terraformrc
          credentials "app.terraform.io" {
            token = "${TF_TOKEN_app_terraform_io}"
          }
          EOF

      - name: Generate auto.tfvars from secrets and hardcoded values
        working-directory: deploy/terraform/k3s-proxmox
        run: |
          cat <<EOF > github.auto.tfvars
          # --- Secrets ---
          user_name           = "${{ secrets.SSH_USERNAME }}"
          port                = ${{ secrets.SSH_SERVER_PORT }}
          root_password       = "${{ secrets.ROOT_PASSWORD }}"
          proxmox_node_name   = "${{ secrets.HOSTNAME }}"
          ssh_public_key      = "${{ secrets.SSH_PUBLIC_KEY }}"
          external_ip         = "${{ env.EXTERNAL_IP }}"
          ssh_username        = "${{ secrets.SSH_USERNAME }}"
          ssh_server_address  = "${{ secrets.SSH_SERVER_ADDRESS }}"
          ssh_server_port     = "${{ secrets.SSH_SERVER_PORT }}"
          ssh_private_key     = "${{ secrets.SSH_PRIVATE_KEY }}"
          # --- Hardcoded values ---
          vm_count            = "${{ secrets.VM_COUNT }}"
          vm_core_count       = "${{ secrets.VM_CORE_COUNT }}"
          vm_memory_mb        = "${{ secrets.VM_MEMORY_MB }}"
          vm_disk_size_gb     = "${{ secrets.VM_DISK_SIZE_GB  }}"
          data_disk_size_gb     = "${{ secrets.DATA_DISK_SIZE_GB  }}"
          macaddr_first_five  = "${{ secrets.MACADDR_FIRST_FIVE }}"
          proxmox_vm_name     = "${{ secrets.HOSTNAME }}"
          node_names          = ${{ secrets.NODE_NAMES }}
          EOF

      - name: Start SSH tunnel to Proxmox API
        working-directory: deploy/terraform/k3s-proxmox
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" | base64 -d > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519.pub
          nohup ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 -N -L 127.0.0.1:8006:127.0.0.1:8006 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER_ADDRESS }} -p ${{ secrets.SSH_SERVER_PORT }} > /dev/null 2>&1 &
          echo $! > ssh_tunnel.pid

      - name: Terraform Init
        working-directory: deploy/terraform/k3s-proxmox
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: deploy/terraform/k3s-proxmox
        run: terraform plan -input=false

      - name: Terraform Apply
        working-directory: deploy/terraform/k3s-proxmox
        run: terraform apply -auto-approve -input=false

      - name: Stop SSH tunnel
        working-directory: deploy/terraform/k3s-proxmox
        if: always()
        run: |
          if [ -f ssh_tunnel.pid ]; then
            kill $(cat ssh_tunnel.pid) || true
            rm -f ssh_tunnel.pid
          fi

      - name: Comment on onboarding issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.PAT_GITHUB_TOKEN }}
          script: |
            const vmCount = parseInt(process.env.VM_COUNT || "1", 10);
            const baseIP = "192.168.1.202";
            const sshPort = "60024";
            const hostname = "k3s-enso-01";

            let commentBody = "✅ K3s VMs have been created successfully!\n\n";

            for (let i = 0; i < vmCount; i++) {
              const isPrimary = i === 0;
              const internalIP = `192.168.1.20${2 + i}`;
              const externalIP = internalIP; // Adjust if different
              const primaryIP = "192.168.1.202";

              commentBody += `# for ${isPrimary ? "k3s primary" : `k3s node ${i + 1}`}\n`;
              commentBody += "```sh\n";
              commentBody += `# Update SSH port (default is 22 for the VM)\n`;
              commentBody += `gh secret set SSH_SERVER_PORT --body "${sshPort}"\n\n`;

              commentBody += `# Update internal IP address to the VM's IP\n`;
              commentBody += `gh secret set SSH_INTERNAL_ADDRESS --body "${internalIP}"\n\n`;

              commentBody += `# Update external IP if needed\n`;
              commentBody += `gh secret set SSH_SERVER_ADDRESS --body "${externalIP}"\n\n`;

              commentBody += `# Change hostname to k3s server\n`;
              commentBody += `gh secret set HOSTNAME --body "${hostname}"\n\n`;

              commentBody += `# Set if this node is primary\n`;
              commentBody += `gh secret set IS_PRIMARY --body "${isPrimary}"\n\n`;

              commentBody += `# Set the primary internal IP (used to join)\n`;
              commentBody += `gh secret set K3S_PRIMARY_INTERNAL_IP --body "${primaryIP}"\n\n`;

              commentBody += `/install-k3s\n`;
              commentBody += "```\n\n";
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 10
            });

            const onboarding = issues.data.find(issue =>
              issue.title && issue.title.includes("Welcome! Let's deploy your homelab")
            );

            if (onboarding) {
              await github.rest.issues.createComment({
                issue_number: onboarding.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            } else {
              core.warning("No onboarding issue found.");
            }
        env:
          VM_COUNT: ${{ secrets.VM_COUNT }}
