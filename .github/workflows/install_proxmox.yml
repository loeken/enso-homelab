name: Proxmox Convert & Template

on:
  workflow_dispatch:

jobs:
  run-proxmox-ansible:
    runs-on: ubuntu-latest

    container:
      image: loeken/enso-devcontainer:latest@sha256:b882d7d93cc5f668a6ea5be012ac2abb7c4033e0f49846362f871d0f7d53130d
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up SSH key inside container
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
          echo "$SSH_PUBLIC_KEY" | base64 -d > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519.pub
          
          echo "SSH key installed"

      - name: Check if SSH port is reachable
        run: |
          echo "Testing SSH connectivity to 94.134.58.210:60023..."
          if nc -zv 94.134.58.210 60023; then
            echo "✅ Port 60023 on 94.134.58.210 is reachable."
          else
            echo "❌ Cannot connect to 94.134.58.210:60023 — check firewall or port forwarding."
            exit 1
          fi

      - name: Run Ansible Playbook
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
            --private-key ~/.ssh/id_ed25519 \
            -i ./deploy/ansible/proxmox/inventory \
            ./deploy/ansible/proxmox/base.yml


      - name: Trigger create_k3s_vms workflow
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/create_k3s_vms.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Comment on onboarding issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ secrets.PAT_GITHUB_TOKEN }}
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 10
            });
            const onboarding = issues.data.find(issue =>
              issue.title && issue.title.includes("Welcome! Let's deploy your homelab")
            );
            if (onboarding) {
              await github.rest.issues.createComment({
                issue_number: onboarding.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "✅ Installed Proxmox, and build debian templates, creating KVMs now.\n\n"
              });
            } else {
              core.warning("No onboarding issue found.");
            }