name: Proxmox Convert & Template

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  run-proxmox-ansible:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null && contains(github.event.comment.body, '/convert-to-proxmox'))
    runs-on: ubuntu-latest

    container:
      image: loeken/enso-devcontainer:latest
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key inside container
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
          echo "$SSH_PUBLIC_KEY" | base64 -d > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519.pub
          
          echo "SSH key installed"

      - name: Check if SSH port is reachable
        run: |
          echo "Testing SSH connectivity to 94.134.58.210:60023..."
          if nc -zv 94.134.58.210 60023; then
            echo "✅ Port 60023 on 94.134.58.210 is reachable."
          else
            echo "❌ Cannot connect to 94.134.58.210:60023 — check firewall or port forwarding."
            exit 1
          fi

      - name: Run Ansible Playbook
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
            --private-key ~/.ssh/id_ed25519 \
            -i ./deploy/ansible/proxmox/inventory \
            ./deploy/ansible/proxmox/base.yml

      - name: Comment on onboarding issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_GITHUB_TOKEN }}
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 10
            });
            const onboarding = issues.data.find(issue =>
              issue.title && issue.title.includes("Welcome! Let's deploy your homelab")
            );
            if (onboarding) {
              await github.rest.issues.createComment({
                issue_number: onboarding.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "✅ Proxmox server is now up and operational! Please comment `/install-k3s-vms` to continue."
              });
            } else {
              core.warning("No onboarding issue found.");
            }