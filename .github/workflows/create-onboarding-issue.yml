name: Create Onboarding Issue

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-onboarding-issue.yml

permissions:
  issues: write
  contents: write

jobs:
  create-issue:
    if: github.repository != 'loeken/enso-homelab'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create onboarding issue
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const base = `https://github.com/${owner}/${repo}/blob/main`;
            await github.rest.issues.create({
              owner,
              repo,
              title: "📝 Welcome! Let's deploy your homelab 🚀",
              body:
                "👋 Welcome to your new **ensō-homelab**!\n\n" +
                "### ✅ Next Steps\n\n" +
                "1. **Configure Secrets**  ([view docs](" + base + "/docs/secrets/README.md))\n\n" +
                "To deploy your homelab, you'll need to set these repository secrets:\n\n" +
                "| Secret | Description |\n" +
                "|--------|-------------|\n" +
                "| `SSH_USERNAME`         | SSH user for your VM/server |\n" +
                "| `SSH_SERVER_ADDRESS`   | Public IP or hostname of the VM/server |\n" +
                "| `SSH_INTERNAL_ADDRESS` | Internal (private) IP for advertising k3s nodes |\n" +
                "| `SSH_SERVER_PORT`      | Custom SSH port (e.g. 60023) |\n" +
                "| `SSH_PRIVATE_KEY`      | Base64-encoded private key for SSH access |\n" +
                "| `TF_TOKEN_app_terraform_io` | Terraform Cloud API token |\n" +
                "| `HOSTNAME`             | Expected hostname of the target node |\n" +
                "| `GITHUB_TOKEN`         | GitHub token for dispatching workflows (optional override) |\n" +
                "| `RENOVATE_TOKEN`       | Token for Renovate bot (if enabled) |\n\n" +
                "<details>\n<summary>💡 Add secrets via CLI</summary>\n\n" +
                "```bash\n" +
                "gh secret set SSH_USERNAME --body \"loeken\"\n" +
                "gh secret set SSH_SERVER_ADDRESS --body \"94.134.58.166\"\n" +
                "gh secret set SSH_INTERNAL_ADDRESS --body \"192.168.1.185\"\n" +
                "gh secret set SSH_SERVER_PORT --body \"60023\"\n" +
                "gh secret set HOSTNAME --body \"homelab\"\n" +
                "gh secret set SSH_PRIVATE_KEY --body \"\$(cat ~/.ssh/id_ed25519 | base64)\"\n" +
                "gh secret set TF_TOKEN_app_terraform_io --body \"your-tf-cloud-token\"\n" +
                "gh secret set GITHUB_TOKEN --body \"\$(gh auth token)\"\n" +
                "gh secret set RENOVATE_TOKEN --body \"your-renovate-token\"\n" +
                "```\n\n</details>\n\n" +
                "_Or create a `.secrets` file to run locally with `act`._\n\n" +
                "---\n\n" +
                "2. **Run the Setup Workflow**\n" +
                "([Install K3s](" + base + "/docs/install/k3s) · " +
                "[Set up Proxmox](" + base + "/docs/install/proxmox))\n\n" +
                "You can:\n- Trigger it manually below 👇\n" +
                "- Or run it locally with [`act`](https://github.com/nektos/act)\n\n" +
                "---\n\n" +
                "### ▶️ Start the Install\n\n" +
                "To kick off the install process, comment with one of the following:\n\n" +
                "- `/install-k3s` → Install K3s using Terraform + k3sup\n" +
                "- `/install-proxmox` → Set up Proxmox on a Debian host and create a VM _(WIP)_\n\n" +
                "This will apply the Terraform stack and set up your homelab infrastructure."
            });

      - name: Rename this workflow to prevent re-triggering
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git mv .github/workflows/create-onboarding-issue.yml .github/workflows/create-onboarding-issue.yml.disabled
          git mv .github/workflows/install_k3s.yml.disabled .github/workflows/install_k3s.yml
          git commit -m "chore: disable onboarding workflow after first run"
          git push