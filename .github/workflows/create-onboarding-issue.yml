---
name: Create Onboarding Issue

on:
  "workflow_dispatch":

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create onboarding issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: >
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const base = `https://github.com/${owner}/${repo}/blob/main`;
            github.rest.issues.create({
              owner,
              repo,
              title: "📝 Welcome! Let's deploy your homelab 🚀",
              body:
                "👋 Welcome to your new **ensō-homelab**!\n\n" +
                "### ✅ Next Steps\n\n" +
                "1. **Configure Secrets**  ([view docs](" + base + "/docs/secrets/README.md))\n\n" +
                "To deploy your homelab, you'll need to set these repository secrets:\n\n" +
                "| Secret | Description |\n" +
                "|--------|-------------|\n" +
                "| `SSH_USERNAME` | SSH user for your VM/server |\n" +
                "| `SSH_SERVER_ADDRESS` | IP or hostname of the VM/server |\n" +
                "| `SSH_PRIVATE_KEY` | Base64-encoded private key|\n" +
                "| `TF_TOKEN_app_terraform_io` | Terraform Cloud API token |\n\n" +
                "<details>\n<summary>💡 Add secrets via CLI</summary>\n\n" +
                "```bash\n" +
                "gh secret set SSH_USERNAME --body \"ubuntu\"\n" +
                "gh secret set SSH_SERVER_ADDRESS --body \"192.168.1.100\"\n" +
                "gh secret set SSH_PRIVATE_KEY --body \"$(cat ~/.ssh/id_rsa | base64)\"\n" +
                "gh secret set TF_TOKEN_app_terraform_io --body \"your-terraform-cloud-token\"\n" +
                "```\n\n</details>\n\n" +
                "_Or create a `.secrets` file to run locally with `act`._\n\n" +
                "---\n\n" +
                "2. **Run the Setup Workflow**\n" +
                "([Install K3s](" + base + "/docs/install/k3s) · " +
                "[Set up Proxmox](" + base + "/docs/install/proxmox))\n\n" +
                "You can:\n- Trigger it manually below 👇\n" +
                "- Or run it locally with [`act`](https://github.com/nektos/act)\n\n" +
                "---\n\n" +
                "### ▶️ Start the Install\n\n" +
                "To kick off the install process, comment with one of the following:\n\n" +
                "- `/install-k3s` → Install K3s using Terraform + k3sup\n" +
                "- `/install-proxmox` → Set up Proxmox on a Debian host and create a VM _(WIP)_\n\n" +
                "This will apply the Terraform stack and set up your homelab infrastructure."
            });
