---
name: Create Onboarding Issue

on:
  workflow_dispatch:

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create onboarding issue
        uses: actions/github-script@v7
        with:
          script: >
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "📝 Welcome! Let's deploy your homelab 🚀",
              body: "👋 Welcome to your new **ensō-homelab**!\n\n### ✅ Next Steps\n\n1. **Configure Secrets**\n\nTo deploy your homelab, you'll need to set these repository secrets:\n\n| Secret | Description |\n|--------|-------------|\n| `SSH_USERNAME` | SSH user for your K3s server |\n| `SSH_SERVER_ADDRESS` | IP or hostname of the K3s server |\n| `SSH_PRIVATE_KEY` | Base64-encoded private key (or plain PEM) |\n| `TF_TOKEN_app_terraform_io` | Terraform Cloud API token |\n\n_You can also create a `.secrets` file to run locally with `act`._\n\n---\n\n2. **Run the Setup Workflow**\n\nYou can:\n- Trigger it manually below 👇\n- Or run it locally with `act`\n\n---\n\n### ▶️ Start the Install\n\nTo kick off the install process, comment with:\n\n`/install-k3s`\n\nThis will apply the Terraform stack and set up K3s + ArgoCD."
            });
