name: Create Onboarding Issue & Respond

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-onboarding-issue.yml
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    if: github.repository != 'loeken/enso-homelab' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create onboarding issue
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            await github.rest.issues.create({
              owner,
              repo,
              title: "📝 Homelab Onboarding: Choose your deployment",
              body:
                "Welcome to your new **ensō-homelab**!\n\n" +
                "Please choose one of the following deployment options by commenting the corresponding code below:\n\n" +
                "1. **Baremetal Install**\n" +
                "   - Comment: `baremetal-install`\n" +
                "2. **Proxmox Single Node**\n" +
                "   - Comment: `proxmox-single-node`\n" +
                "3. **Proxmox Multi Node**\n" +
                "   - Comment: `proxmox-multi-node`\n\n" +
                "Once you comment, the appropriate installation workflow will be triggered automatically."
            });

  respond-to-comments:
    if: github.event_name == 'issue_comment' && contains(github.event.issue.title, 'Homelab Onboarding')
    runs-on: ubuntu-latest
    steps:
      - name: Respond to onboarding commands
        id: respond-to-onboarding-commands
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        with:
          script: |
            const comment = context.payload.comment.body.trim().toLowerCase();
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let workflow = null;

            if (comment === 'baremetal-install') {
              workflow = "install_k3s.yml";
            } else if (comment === 'proxmox-single-node' || comment === 'proxmox-multi-node') {
              workflow = "install_proxmox.yml";
            }

            if (workflow) {
              await github.rest.issues.createComment({
                issue_number,
                owner,
                repo,
                body: `🚀 Starting workflow: **${workflow.replace('.yml','')}**. Check the Actions tab for progress.`
              });
              core.setOutput('trigger_workflow', workflow);
            }
      - name: Trigger selected workflow
        if: steps.respond-to-onboarding-commands.outputs.trigger_workflow
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/${{ steps.respond-to-onboarding-commands.outputs.trigger_workflow }}/dispatches \
            -d '{"ref":"main"}'
