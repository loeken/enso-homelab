name: Check Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest
    env:
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_SERVER_ADDRESS: ${{ secrets.SSH_SERVER_ADDRESS }}
      SSH_SERVER_PORT: ${{ secrets.SSH_SERVER_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Check Secrets via SSH Tunnel
        run: |
          set -euo pipefail

          echo "🔐 Writing SSH key..."
          echo "$SSH_PRIVATE_KEY" | base64 -d > /tmp/id_ed25519
          chmod 600 /tmp/id_ed25519

          echo "🔌 Starting SSH tunnel..."
          ssh -v -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=no \
            -i /tmp/id_ed25519 \
            -N -L 127.0.0.1:6443:127.0.0.1:6443 \
            ${SSH_USERNAME}@${SSH_SERVER_ADDRESS} \
            -p ${SSH_SERVER_PORT} > ssh.log 2>&1 &
          TUNNEL_PID=$!
          echo "SSH tunnel PID: $TUNNEL_PID"

          echo "🕒 Waiting for tunnel to become ready..."
          for i in {1..15}; do
            if curl -ks https://127.0.0.1:6443/version > /dev/null; then
              echo "✅ API server reachable through tunnel."
              break
            fi
            echo "⏳ Attempt $i: API server not reachable yet."
            sleep 2
          done

          echo "📄 Writing kubeconfig..."
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig.yaml
          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|' kubeconfig.yaml

          echo "🔎 Cluster nodes:"
          kubectl --kubeconfig=kubeconfig.yaml get nodes || echo "❌ kubectl failed"

          echo "🔍 Scanning data/credentials/mysecrets_unencrypted/*.yaml..."
          ls data/credentials/mysecrets_unencrypted/
          rm data/credentials/mysecrets_unencrypted/*namespace*.yaml
          ls data/credentials/mysecrets_unencrypted/
          shopt -s nullglob
          found_files=(data/credentials/mysecrets_unencrypted/*.yaml)
          if [ ${#found_files[@]} -eq 0 ]; then
            echo "❌ No credential files found."
            kill $TUNNEL_PID
            exit 1
          fi

          found_missing=0
          for f in "${found_files[@]}"; do
            base=$(basename "$f")
            ns="${base%%_*}"
            secret="${base#*_}"
            secret="${secret%.yaml}"

            echo "🔍 Checking secret '$secret' in namespace '$ns'..."
            if ! kubectl --kubeconfig=kubeconfig.yaml get secret "$secret" -n "$ns" > /dev/null 2>&1; then
              echo "❌ Secret '$secret' missing in namespace '$ns'"
              echo "💡 Suggested command:"
              echo "cp $f data/credentials/mysecrets_unencrypted/$base"
              echo "cat data/credentials/mysecrets_unencrypted/$base | kubeseal > deploy/mysecrets/templates/$base"
              echo ""
              found_missing=1
            else
              echo "✅ Secret '$secret' exists in namespace '$ns'"
            fi
          done

          echo "🧹 Cleaning up SSH tunnel..."
          kill $TUNNEL_PID || true

          if [ "$found_missing" -eq 1 ]; then
            echo "❌ One or more secrets are missing. Failing the job."
            exit 1
          fi

        shell: bash
      - name: Comment on onboarding issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.PAT_GITHUB_TOKEN }}
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 10
            });
            const onboarding = issues.data.find(issue =>
              issue.title && issue.title.includes("Welcome! Let's deploy your homelab")
            );
            if (onboarding) {
              await github.rest.issues.createComment({
                issue_number: onboarding.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "✅ Your cluster is up and the namespaces are loaded and secrets are synced. enable the apps in deploy/argocd/values.yaml\n\n"
              });
            } else {
              core.warning("No onboarding issue found.");
            }