name: Validate Required Secrets Proxmox

on:
  workflow_call:
    inputs: {}
    secrets:
      SSH_USERNAME: {}
      SSH_SERVER_ADDRESS: {}
      SSH_INTERNAL_ADDRESS: {}
      SSH_SERVER_PORT: {}
      SSH_PRIVATE_KEY: {}
      TF_TOKEN_app_terraform_io: {}
      HOSTNAME: {}
      TF_CLOUD_ORGANIZATION: {}
      KUBECONFIG: {}
      PAT_GITHUB_TOKEN: {}
      RENOVATE_TOKEN: {}
      DEPLOYMENT_TYPE: {}
      VM_COUNT: {}
      VM_CORE_COUNT: {}
      VM_MEMORY_MB: {}
      VM_DISK_SIZE_GB: {}
      DATA_DISK_SIZE_GB: {}
      MACADDR_FIRST_FIVE: {}
      NODE_NAMES: {}
  workflow_dispatch: {}

jobs:
  validate-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Validate required secrets
        run: .github/scripts/validate-secrets.sh
        shell: bash
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_SERVER_ADDRESS: ${{ secrets.SSH_SERVER_ADDRESS }}
          SSH_INTERNAL_ADDRESS: ${{ secrets.SSH_INTERNAL_ADDRESS }}
          SSH_SERVER_PORT: ${{ secrets.SSH_SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          HOSTNAME: ${{ secrets.HOSTNAME }}
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          PAT_GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          DEPLOYMENT_TYPE: ${{ secrets.DEPLOYMENT_TYPE }}
          VM_COUNT: ${{ secrets.VM_COUNT }}
          VM_CORE_COUNT: ${{ secrets.VM_CORE_COUNT }}
          VM_MEMORY_MB: ${{ secrets.VM_MEMORY_MB }}
          VM_DISK_SIZE_GB: ${{ secrets.VM_DISK_SIZE_GB }}
          DATA_DISK_SIZE_GB: ${{ secrets.VM_DISK_SIZE_GB }}
          MACADDR_FIRST_FIVE: ${{ secrets.MACADDR_FIRST_FIVE }}
          NODE_NAMES: ${{ secrets.NODE_NAMES }}

      - name: Acknowledge command
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ secrets.PAT_GITHUB_TOKEN }}
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 10
            });

            const onboarding = issues.data.find(issue =>
              issue.title && issue.title.includes("Welcome! Let's deploy your homelab")
            );

            if (!onboarding) {
              core.warning("No onboarding issue found.");
              return;
            }

            const comments = await github.rest.issues.listComments({
              issue_number: onboarding.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const alreadyPosted = comments.data.some(comment =>
              comment.body && comment.body.includes("✅ All required secrets validated.")
            );

            if (alreadyPosted) {
              console.log("✅ Secrets validation message already posted. Skipping.");
              return;
            }

            await github.rest.issues.createComment({
              issue_number: onboarding.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ All required secrets validated.\n\n" +
                    "📦 **Prepare your inventory:**\n" +
                    "```sh\n" +
                    "cp deploy/ansible/proxmox/inventory.example deploy/ansible/proxmox/inventory\n" +
                    "```\n\n" +
                    "📝 **Commit and push the inventory file:**\n" +
                    "```sh\n" +
                    "git add deploy/ansible/proxmox/inventory\n" +
                    "git commit -m \"add inventory file\"\n" +
                    "git push\n" +
                    "```\n\n" +
                    "▶️ **Then comment:**\n" +
                    "```sh\n" +
                    "/validate-proxmox-inventory\n" +
                    "```\n" +
                    "to continue."
            });