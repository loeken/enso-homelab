name: Manual K3s Install Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  run-install:
    if: github.event.issue.pull_request == null && github.event.comment.body == '/install-k3s'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Existing Secrets
        id: check_secrets
        run: |
          EXISTING_PRIVATE_KEY=$(gh secret list | grep ARGOCD_DEPLOY_PRIVATE_KEY || echo "not_found")
          EXISTING_PUBLIC_KEY=$(gh secret list | grep ARGOCD_DEPLOY_PUBLIC_KEY || echo "not_found")
          echo "EXISTING_PRIVATE_KEY=$EXISTING_PRIVATE_KEY" >> $GITHUB_ENV
          echo "EXISTING_PUBLIC_KEY=$EXISTING_PUBLIC_KEY" >> $GITHUB_ENV

      - name: Generate SSH Key Pair (if not exists)
        if: env.EXISTING_PRIVATE_KEY == 'not_found' || env.EXISTING_PUBLIC_KEY == 'not_found'
        id: generate_ssh_keys
        run: |
          ssh-keygen -t ed25519 -f deploy_key -N "" -C "argocd-deploy-key"
          echo "ARGOCD_DEPLOY_PRIVATE_KEY=$(base64 -w 0 deploy_key)" >> $GITHUB_ENV
          echo "ARGOCD_DEPLOY_PUBLIC_KEY=$(cat deploy_key.pub)" >> $GITHUB_ENV

      - name: Save SSH Keys as Secrets (if generated)
        if: env.EXISTING_PRIVATE_KEY == 'not_found' || env.EXISTING_PUBLIC_KEY == 'not_found'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          gh secret set ARGOCD_DEPLOY_PRIVATE_KEY --body "$ARGOCD_DEPLOY_PRIVATE_KEY"
          gh secret set ARGOCD_DEPLOY_PUBLIC_KEY --body "$ARGOCD_DEPLOY_PUBLIC_KEY"

      - name: Register Deploy Key in Repository
        if: env.EXISTING_PUBLIC_KEY == 'not_found'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/keys \
            -d '{
              "title": "ArgoCD Deploy Key",
              "key": "'"$ARGOCD_DEPLOY_PUBLIC_KEY"'",
              "read_only": false
            }'

      - name: Acknowledge command
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🚀 Initiating K3s installation via GitHub Actions..."
            });

      - name: Trigger Terraform Infrastructure Workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/install_k3s.yml/dispatches \
            -d '{"ref":"main", "inputs": {"triggered_by": "issue_comment"}}'
