name: Manual K3s Install Trigger

on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  run-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Check for Existing Secrets
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          EXISTING_PRIVATE_KEY=$(gh secret list | grep ARGOCD_DEPLOY_PRIVATE_KEY || echo "not_found")
          if [ "$EXISTING_PRIVATE_KEY" != "not_found" ]; then
            echo "Secret already exists. Skipping key generation."
            echo "key_exists=true" >> $GITHUB_ENV
          else
            echo "key_exists=false" >> $GITHUB_ENV
          fi

      - name: Generate and Upload SSH Key Pair
        if: env.key_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          # Generate SSH key pair
          ssh-keygen -t ed25519 -f deploy_key -N "" -C "argocd-deploy-key"
          PRIVATE_KEY=$(base64 -w 0 deploy_key)
          PUBLIC_KEY=$(cat deploy_key.pub)
      
          # Upload secrets
          gh secret set ARGOCD_DEPLOY_PRIVATE_KEY --body "$PRIVATE_KEY"
          gh secret set ARGOCD_DEPLOY_PUBLIC_KEY --body "$PUBLIC_KEY"
      
          echo "SSH key pair generated and uploaded as secrets."
      
          # Make PUBLIC_KEY available to later steps
          echo "PUBLIC_KEY=${PUBLIC_KEY}" >> $GITHUB_ENV
        

      - name: Debug Public Key
        if: env.key_exists == 'false'
        run: |
          echo "Public Key: $PUBLIC_KEY"

      - name: Register Deploy Key in Repository
        if: env.key_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/keys \
            -d '{
              "title": "ArgoCD Deploy Key",
              "key": "'"$PUBLIC_KEY"'",
              "read_only": false
            }'

      - name: Acknowledge command
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🚀 Initiating K3s installation via GitHub Actions..."
            });

      - name: Trigger Terraform Infrastructure Workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/install_k3s.yml/dispatches \
            -d '{"ref":"main", "inputs": {"triggered_by": "issue_comment"}}'
