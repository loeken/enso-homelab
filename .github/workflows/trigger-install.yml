name: Manual K3s Install Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  run-install:
    if: github.event.issue.pull_request == null && github.event.comment.body == '/install-k3s'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Acknowledge command
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🚀 Initiating K3s installation via GitHub Actions..."
            });
      - name: Trigger Terraform Infrastructure Workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/install_k3s.yml/dispatches \
            -d '{"ref":"main", "inputs": {"triggered_by": "issue_comment"}}'
