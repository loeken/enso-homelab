name: Installer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/installer.yml
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  # ───────────────────────────────────────────────
  # 1. CREATE INITIAL ISSUE
  # ───────────────────────────────────────────────
  create-issue:
    if: github.repository != 'loeken/enso-homelab' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Create onboarding issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { repo, owner } = context.repo;
            await github.rest.issues.create({
              owner,
              repo,
              title: "📝 Welcome! Let's deploy your homelab 🚀",
              body:
                "👋 Welcome to your new **ensō-homelab**!\n\n" +
                "## 🛡️ Required Secrets\n\n" +
                "Set **all** of these secrets before choosing your deployment type:\n\n" +
                "- `DEPLOYMENT_TYPE`\n" +
                "- `SSH_USERNAME`\n" +
                "- `SSH_SERVER_ADDRESS`\n" +
                "- `SSH_INTERNAL_ADDRESS`\n" +
                "- `SSH_SERVER_PORT`\n" +
                "- `SSH_PRIVATE_KEY`\n" +
                "- `TF_TOKEN_app_terraform_io`\n" +
                "- `HOSTNAME`\n" +
                "- `TF_CLOUD_ORGANIZATION`\n" +
                "- `PAT_GITHUB_TOKEN`\n" +
                "- `RENOVATE_TOKEN`\n\n" +
                "### Additional secrets required **only for `/proxmox-single`**:\n" +
                "- `VM_COUNT` (default: 3)\n" +
                "- `VM_CORE_COUNT` (default: 3)\n" +
                "- `VM_MEMORY_MB` (default: 8192)\n" +
                "- `VM_DISK_SIZE_GB` (default: 100)\n" +
                "- `VM_DISK_SIZE_GB` (default: 1000)\n" +
                "- `MACADDR_FIRST_FIVE`\n\n" +
                "**Example:**\n" +
                "```sh\n" +
                "gh secret set DEPLOYMENT_TYPE --body \"your-deployment-type\"\n" +
                "gh secret set SSH_USERNAME --body \"your-username\"\n" +
                "gh secret set SSH_SERVER_ADDRESS --body \"your-server-address\"\n" +
                "gh secret set SSH_INTERNAL_ADDRESS --body \"your-internal-address\"\n" +
                "gh secret set SSH_SERVER_PORT --body \"your-ssh-port\"\n" +
                "gh secret set SSH_PRIVATE_KEY --body \"$(cat ~/.ssh/id_ed25519 | base64)\"\n" +
                "gh secret set TF_TOKEN_app_terraform_io --body \"your-tf-cloud-token\"\n" +
                "gh secret set HOSTNAME --body \"your-hostname\"\n" +
                "gh secret set TF_CLOUD_ORGANIZATION --body \"your-tf-org\"\n" +
                "gh secret set PAT_GITHUB_TOKEN --body \"your-github-token\"\n" +
                "gh secret set RENOVATE_TOKEN --body \"your-renovate-token\"\n" +
                "# Only for /proxmox-single:\n" +
                "gh secret set VM_COUNT --body \"3\"\n" +
                "gh secret set VM_CORE_COUNT --body \"3\"\n" +
                "gh secret set VM_MEMORY_MB --body \"8192\"\n" +
                "gh secret set VM_DISK_SIZE_GB --body \"100\"\n" +
                "gh secret set VM_DISK_SIZE_GB --body \"1000\"\n" +
                "gh secret set MACADDR_FIRST_FIVE --body \"00:11:22:33:44\"\n" +
                "```\n\n" +
                "---\n\n" +
                "## 🚦 Choose your deployment path\n\n" +
                "Comment one of the following to select your deployment type:\n\n" +
                "- `/install-k3s` (Baremetal K3s)\n" +
                "- `/proxmox-single` (Proxmox Single Node)\n" +
                "---\n\n" +
                "Once your secrets are set, comment your deployment type above to continue. The workflow will validate your secrets before proceeding and generate a values.yaml.example for you.\n"
            });

  # ───────────────────────────────────────────────
  # 2. RESPOND TO COMMENTS
  # ───────────────────────────────────────────────
  respond-to-comments:
    if: github.event_name == 'issue_comment' && contains(github.event.issue.title, 'Welcome! Let')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Handle deployment type selection
        id: handle-deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const { number: issue_number } = context.issue;
            const { repo, owner } = context.repo;

            let deploymentType = null;
            if (comment === '/install-k3s') deploymentType = 'install-k3s';
            else if (comment === '/proxmox-single') deploymentType = 'proxmox-single';
            else if (comment === '/proxmox-multi') deploymentType = 'proxmox-multi';
            else if (comment === '/check-secrets') deploymentType = 'check-secrets';
            else if (comment === '/validate-proxmox-inventory') deploymentType = 'validate-proxmox-inventory';

            if (deploymentType) {
              const execSync = require('child_process').execSync;
              execSync(
                `gh secret set DEPLOYMENT_TYPE --body "${deploymentType}"`,
                { stdio: 'inherit', env: { ...process.env, GH_TOKEN: process.env.GH_TOKEN } }
              );

              await github.rest.issues.createComment({
                issue_number,
                owner,
                repo,
                body: `✅ Deployment type set to \`${deploymentType}\`.`
              });

              core.setOutput('trigger_validation', 'true');
              core.exportVariable('DEPLOYMENT_TYPE', deploymentType);
            }

  # ───────────────────────────────────────────────
  # 3. DISPATCH WORKFLOWS
  # ───────────────────────────────────────────────
      - name: Trigger validate-secrets workflow proxmox
        if: steps.handle-deployment.outputs.trigger_validation == 'true' && env.DEPLOYMENT_TYPE == 'proxmox-single'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/validate-secrets-proxmox.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Trigger validate-secrets workflow k3s
        if: steps.handle-deployment.outputs.trigger_validation == 'true' && env.DEPLOYMENT_TYPE == 'install-k3s'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/validate-secrets-k3s.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Trigger validate-proxmox-inventory workflow
        if: steps.handle-deployment.outputs.trigger_validation == 'true' && env.DEPLOYMENT_TYPE == 'validate-proxmox-inventory'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/validate-proxmox-inventory.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Prepare and preview values.yaml
        run: |
          USERNAME="${GITHUB_REPOSITORY%/*}"
          REPONAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p deploy/argocd
          cp deploy/argocd/values.yaml.example deploy/argocd/values.yaml.tmp
          sed -i "s/loeken/${USERNAME}/g" deploy/argocd/values.yaml.tmp
          sed -i "s/enso-homelab/${REPONAME}/g" deploy/argocd/values.yaml.tmp

          echo "📄 Contents of values.yaml (to be uploaded):"
          echo "────────────────────────────────────────────"
          cat deploy/argocd/values.yaml.tmp
          echo "────────────────────────────────────────────"

      - name: Upload values.yaml using gh CLI (only if not exists)
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          if [ ! -f deploy/argocd/values.yaml ]; then
            USERNAME="${GITHUB_REPOSITORY%/*}"
            REPONAME="${GITHUB_REPOSITORY#*/}"
            mkdir -p deploy/argocd
            cp deploy/argocd/values.yaml.example deploy/argocd/values.yaml.tmp
            sed -i "s/loeken/${USERNAME}/g" deploy/argocd/values.yaml.tmp
            sed -i "s/enso-homelab/${REPONAME}/g" deploy/argocd/values.yaml.tmp
            mv deploy/argocd/values.yaml.tmp deploy/argocd/values.yaml

            CONTENT_B64=$(base64 -w 0 deploy/argocd/values.yaml)
            COMMIT_MSG="Add values.yaml with repo info"
            BRANCH="main"
            FILEPATH="deploy/argocd/values.yaml"
            SHA=$(gh api repos/${GITHUB_REPOSITORY}/contents/${FILEPATH} --jq .sha || echo "")

            gh api repos/${GITHUB_REPOSITORY}/contents/${FILEPATH} \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -f message="$COMMIT_MSG" \
              -f content="$CONTENT_B64" \
              -f branch="$BRANCH" \
              ${SHA:+-f sha="$SHA"}
          else
            echo "deploy/argocd/values.yaml already exists, skipping upload."
          fi

      - name: Trigger install_k3s workflow
        if: steps.handle-deployment.outputs.trigger_validation == 'true' && env.DEPLOYMENT_TYPE == 'install-k3s'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/install_k3s.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Trigger check-secrets workflow
        if: steps.handle-deployment.outputs.trigger_validation == 'true' && env.DEPLOYMENT_TYPE == 'check-secrets'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/check-secrets.yml/dispatches \
            -d '{"ref":"main"}'
