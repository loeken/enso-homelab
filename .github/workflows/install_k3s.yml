name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/terraform/**'
  push:
    branches:
      - main
    paths:
      - 'deploy/terraform/**'
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Source of the trigger'
        required: false
        default: 'manual'

permissions:
  contents: read

jobs:
  install-k3s:
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.terraformrc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Install k3sup
        run: curl -sLS https://get.k3sup.dev | sh

      - name: Set external IP
        run: |
          if [ "${ACT}" = "true" ]; then
            echo "EXTERNAL_IP=$(curl -s ifconfig.co -4)" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
          else
            echo "EXTERNAL_IP=${{ secrets.SSH_SERVER_ADDRESS }}" >> "$GITHUB_ENV"
            echo "INTERNAL_IP=${{ secrets.SSH_INTERNAL_ADDRESS }}" >> "$GITHUB_ENV"
          fi
      - name: Configure Terraform local execution
        working-directory: deploy/terraform/k3s
        run: |
          cat <<EOF > ${{ github.workspace }}/.terraformrc
          credentials "app.terraform.io" {
            token = "${TF_TOKEN_app_terraform_io}"
          }
          EOF

      - name: Generate auto.tfvars from secrets
        working-directory: deploy/terraform/k3s
        run: |
          cat <<EOF > github.auto.tfvars
          ssh_username        = "${{ secrets.SSH_USERNAME }}"
          ssh_server_address  = "${{ secrets.SSH_SERVER_ADDRESS }}"
          ssh_server_port     = "${{ secrets.SSH_SERVER_PORT }}"
          ssh_private_key     = "${{ secrets.SSH_PRIVATE_KEY }}"
          internal_ip         = "${{ env.INTERNAL_IP }}"
          external_ip         = "${{ env.EXTERNAL_IP }}"
          kubernetes_version  = "v1.26.4+k3s1"
          hostname            = "${{ secrets.HOSTNAME }}"
          storage             = "local-path"
          EOF

      - name: Configure Terraform local execution (cloud block)
        run: |
          cat <<EOF > ${{ github.workspace }}/.terraformrc
          credentials "app.terraform.io" {
            token = "${TF_TOKEN_app_terraform_io}"
          }
          cloud {
            hostname     = "app.terraform.io"
            organization = "ime"
            workspaces {
              name = "enso-backend"
            }
            operations {
              execution_mode = "local"
            }
          }
          EOF

      - name: Terraform Init
        working-directory: deploy/terraform/k3s
        run: terraform init -input=false

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: deploy/terraform/k3s
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: deploy/terraform/k3s
        run: terraform apply -auto-approve -input=false

      - name: Copy kubeconfig to host or upload as artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${ACT}" = "true" ]; then
            cp deploy/terraform/k3s/kubeconfig /output/kubeconfig
          else
            cp deploy/terraform/k3s/kubeconfig kubeconfig
          fi

      - name: Upload kubeconfig artifact (only in GitHub Actions)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig
          path: kubeconfig
          retention-days: 1
