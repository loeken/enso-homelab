services:
  enso-homelab:
    container_name: enso-homelab-test
    build:
      context: .
      dockerfile: ./deploy/docker/Dockerfile.test
    restart: "no"
    env_file: .env.test
    networks:
      - enso-homelab-test-network
    volumes:
      - ${HOME}/.config/gh:/home/vscode/.config/gh
      - ${HOME}/.ssh:/home/vscode/.ssh
      - ${HOME}/.zhistory:/home/vscode/.zhistory
      - ${PWD}/data:/app/data

networks:
  enso-homelab-test-network:
    driver: bridge