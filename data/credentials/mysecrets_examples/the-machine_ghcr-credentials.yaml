apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: the-machine
type: kubernetes.io/dockerconfigjson
stringData:
  # Generate a GitHub PAT at https://github.com/settings/tokens
  # Required scope: read:packages (classic token)
  # Then fill in the password field below before sealing.
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"loeken","password":"YOUR_GITHUB_PAT_HERE"}}}'
