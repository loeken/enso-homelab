---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-credentials
  namespace: llm
type: Opaque
stringData:
  # Brave Search API key - obtain from https://api.search.brave.com/app/keys
  BRAVE_API_KEY: "<your-brave-search-api-key>"

  # GitHub Personal Access Token - create at https://github.com/settings/tokens
  # Required scopes: repo, read:org, read:user
  GITHUB_PERSONAL_ACCESS_TOKEN: "<ghp_your-github-pat>"

  # DATABASE_URL is NOT needed here - the postgres MCP server uses the
  # llm-postgresql-cluster-app secret created automatically by the CNPG operator.
