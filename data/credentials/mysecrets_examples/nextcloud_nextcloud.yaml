apiVersion: v1
kind: Secret
metadata:
  name: nextcloud
  namespace: nextcloud
type: Opaque
stringData:
  # Nextcloud admin credentials
  nextcloud-username: nextcloud
  nextcloud-password: "generate|16"

  # PostgreSQL credentials
  postgres-username: nextcloud
  postgres-password: "generate|16"
  postgres-admin-password: "generate|16"
  postgresql-replication-password: "generate|16"

  # SMTP configuration
  smtp_username: homelab@example.com
  smtp_password: topsecure

  # OIDC / Authelia client secret
  oidc_client_secret: topsecure
