apiVersion: v1
kind: Secret
metadata:
  name: authelia
  namespace: authelia
  labels:
    app.kubernetes.io/name: authelia
type: Opaque
stringData:
  # SMTP credentials
  notifier.smtp.username: "<your-smtp-username>"
  notifier.smtp.password.txt: "<your-smtp-password>"

  # Shared secret for OIDC clients (use strong secrets)
  nextcloud.oidc.sharedsecret: "<shared-secret-for-nextcloud>"
  jellyfin.oidc.sharedsecret: "<shared-secret-for-jellyfin>"
  nextcloud.oidc.sharedsecret: "<shared-secret-for-nextcloud>"

  session.encryption.key: "<random-base64-session-key>"
  storage.encryption.key: "<random-base64-storage-key>"

  # Optional: JWT HMAC secret for identity validation and OIDC
  identity_validation.reset_password.jwt.hmac.key: "<random-base64-jwt-key>"
  identity_providers.oidc.hmac.key: "<random-base64-oidc-hmac-key>"

  # Optional: log to file (if enabled)
  authelia.log.file_path: "/config/authelia.log"