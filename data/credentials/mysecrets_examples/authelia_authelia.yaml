apiVersion: v1
kind: Secret
metadata:
  name: authelia
  namespace: authelia
  labels:
    app.kubernetes.io/name: authelia
type: Opaque
stringData:
  # SMTP credentials
  notifier.smtp.password: "<your-smtp-password>"

  # Shared secret for OIDC clients (use strong secrets)
  oidc.sharedsecret.nextcloud: "<shared-secret-for-nextcloud>"
  oidc.sharedsecret.jellyfin: "<shared-secret-for-jellyfin>"
  oidc.sharedsecret.grafana: "<shared-secret-for-grafana>"
  oidc.sharedsecret.heimdallr: "<shared-secret-for-heimdallr>"

  session.encryption.key: "<random-base64-session-key>"
  storage.encryption.key: "<random-base64-storage-key>"

  # OIDC JWKS and issuer private key (required for OIDC)
  identity_providers.oidc.jwks: "<generate-rsa-key-pair-for-oidc>"
  identity_providers.oidc.issuer_private_key: "<rsa-private-key-for-oidc>"

  # Optional: JWT HMAC secret for identity validation and OIDC
  identity_validation.reset_password.jwt.hmac.key: "<random-base64-jwt-key>"
  identity_providers.oidc.hmac.key: "<random-base64-oidc-hmac-key>"

  # Optional: log to file (if enabled)
  authelia.log.file_path: "/config/authelia.log"