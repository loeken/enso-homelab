apiVersion: v1
kind: Secret
metadata:
  name: the-machine
  namespace: the-machine
type: Opaque
stringData:
  # Forex data source (https://www.exchangerate-api.com)
  EXCHANGERATEAPI_KEY: ""

  # Crypto OHLCV prices (https://www.cryptocompare.com/cryptopian/api-keys)
  CRYPTOCOMPARE_API_KEY: ""

  # Optional crypto social collectors (leave empty if not enabling those collectors)
  TWITTER_BEARER_TOKEN: ""
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""

  # Alerting
  SLACK_WEBHOOK_URL: ""
  ALERT_WEBHOOK_URL: ""

  # LLM endpoint (used by analyzer-semantic and trader-ingestion)
  LLM_API_KEY: ""

  # ClickHouse credentials (must match what the ClickHouseInstallation CR sets up)
  CLICKHOUSE_USER: "machine"
  CLICKHOUSE_PASSWORD: "changeme"

  # Trader ingestion
  WIKI_LLM_MODEL: "aneramodel"
