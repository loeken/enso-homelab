apiVersion: v1
kind: Secret
metadata:
  name: grafana-oauth-config
  namespace: observability
type: Opaque
stringData:
  # Only the client secret is sealed here.
  # All other OAuth settings (URLs, scopes, etc.) are templated from .Values.domain
  # in the ArgoCD Application (deploy/argocd/templates/observability_grafana.yaml).
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "SHARED_KEYS"
