---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui
  namespace: llm
type: Opaque
stringData:
  # Used to sign Open WebUI session tokens - generate a random 32-char string
  WEBUI_SECRET_KEY: generate|32
# Note: DATABASE_URL is sourced automatically from the CNPG secret:
#   kubectl get secret -n llm-postgresql llm-postgresql-cluster-app -o jsonpath='{.data.uri}' | base64 -d
