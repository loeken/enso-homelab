---
- name: Get current kernel version
  ansible.builtin.command: uname -r
  register: kernel_version
  changed_when: false

- name: Add Proxmox APT source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-install-repo.list
    content: "deb [arch=amd64] http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
    mode: '0644'
    backup: true

- name: Download Proxmox GPG key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
    mode: '0644'

- name: Remove Proxmox enterprise repo if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent

- name: Remove Proxmox Enterprise repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent

- name: Remove enterprise.proxmox.com lines from /etc/apt/sources.list
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*enterprise.proxmox.com.*'
    state: absent

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: Perform full upgrade
  ansible.builtin.apt:
    upgrade: full
    update_cache: true

- name: Install PVE kernel
  ansible.builtin.apt:
    name: pve-kernel-6.2
    state: present

- name: Install full Proxmox stack
  ansible.builtin.apt:
    name:
      - proxmox-ve
      - postfix
      - open-iscsi
      - lvm2
    state: latest
    update_cache: true
    autoremove: true

- name: Add IOMMU kernel boot parameter
  ansible.builtin.blockinfile:
    path: /etc/default/grub
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Do not modify or remove this marker"
    block: |
      GRUB_CMDLINE_LINUX_DEFAULT="quiet intel_iommu=on"

- name: Append kernel modules to load
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
  loop:
    - vfio
    - vfio_iommu_type1
    - vfio_pci
    - vfio_virqfd

- name: Remove current kernel if not a Proxmox kernel
  ansible.builtin.apt:
    name: "linux-image-{{ kernel_version.stdout }}"
    state: absent
  when: "'pve' not in kernel_version.stdout"

- name: Update GRUB config
  ansible.builtin.command: update-grub

- name: Remove old SSH key from known_hosts
  ansible.builtin.shell: |
    ssh-keygen -R "{{ inventory_hostname }}" || true
    ssh-keygen -R "{{ ansible_host }}" || true
  delegate_to: localhost
  changed_when: false

- name: Reboot system if required
  ansible.builtin.reboot:
  when: "'pve' not in kernel_version.stdout"

- name: Wait for node to become reachable
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | default('22') }}"
    delay: 3
    timeout: 300

