---
- name: Get current kernel version
  ansible.builtin.command: uname -r
  register: kernel_version
  changed_when: false

- name: Ensure Proxmox no-subscription repo is present
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-no-subscription.list
    line: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
    create: yes

- name: Download Proxmox GPG key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
    mode: '0644'

- name: Remove enterprise.proxmox.com lines from /etc/apt/sources.list
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*enterprise.proxmox.com.*'
    state: absent

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: Perform full upgrade
  ansible.builtin.apt:
    upgrade: full
    update_cache: true

- name: Install PVE kernel
  ansible.builtin.apt:
    name: pve-kernel-6.2
    state: present

- name: Install full Proxmox stack
  ansible.builtin.apt:
    name:
      - proxmox-ve
      - postfix
      - open-iscsi
      - lvm2
    state: latest
    update_cache: true
    autoremove: true

- name: Add IOMMU kernel boot parameter
  ansible.builtin.blockinfile:
    path: /etc/default/grub
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Do not modify or remove this marker"
    block: |
      GRUB_CMDLINE_LINUX_DEFAULT="quiet intel_iommu=on"

- name: Append kernel modules to load
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
  loop:
    - vfio
    - vfio_iommu_type1
    - vfio_pci
    - vfio_virqfd

- name: Update GRUB config
  ansible.builtin.command: update-grub

- name: Gather facts for interface detection
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Identify physical interfaces and sort them
  ansible.builtin.set_fact:
    physical_interfaces: "{{ ansible_facts.interfaces | reject('match', '^(lo|wlo.*|vmbr.*|tap.*)$') | list | sort }}"

- name: Identify the primary interface
  ansible.builtin.set_fact:
    primary_interface: "{{ physical_interfaces | first }}"

- name: Write network interface config with vmbr0
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    mode: '0644'
  register: network_interface

- name: Disable Proxmox auto-network commit
  ansible.builtin.systemd:
    name: pvenetcommit.service
    enabled: false
    masked: true

- name: Restart networking after bridge config
  ansible.builtin.systemd:
    name: networking
    state: restarted
    daemon_reload: true
  when: network_interface.changed

- name: Remove old SSH key from known_hosts
  ansible.builtin.shell: |
    ssh-keygen -R "{{ inventory_hostname }}" || true
    ssh-keygen -R "{{ ansible_host }}" || true
  delegate_to: localhost
  changed_when: false

- name: Reboot the system (non-blocking)
  ansible.builtin.shell: |
    sleep 2 && reboot
  async: 1
  poll: 0
  ignore_errors: true
  when: "'pve' not in kernel_version.stdout"

- name: Pause for 150seconds to let system start rebooting ( behind nat otherwise times out )
  ansible.builtin.pause:
    seconds: 150
  when: "'pve' not in kernel_version.stdout"

- name: Wait for node to become reachable
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | default('22') }}"
    delay: 3
    timeout: 300

- name: Remove current kernel if not a Proxmox kernel
  ansible.builtin.apt:
    name: "linux-image-{{ kernel_version.stdout }}"
    state: absent
  when: "'pve' not in kernel_version.stdout"

- name: Disable Proxmox enterprise repo (if present)
  ansible.builtin.shell: |
    if [ -f /etc/apt/sources.list.d/pve-enterprise.list ]; then
      sed -i 's/^deb/#deb/' /etc/apt/sources.list.d/pve-enterprise.list
    fi
  changed_when: false