---
- name: Check if SSH private key exists
  ansible.builtin.stat:
    path: /root/.ssh/id_rsa
  register: ssh_file

- name: Generate SSH key if it does not exist
  ansible.builtin.command: ssh-keygen -f /root/.ssh/id_rsa -t rsa -N ''
  when: not ssh_file.stat.exists

- name: Fetch public key from node
  ansible.builtin.fetch:
    src: /root/.ssh/id_rsa.pub
    dest: "/tmp/id_rsa_{{ inventory_hostname }}.pub"
    flat: true

- name: Add the public key to authorized keys on master
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ lookup('file', '/tmp/id_rsa_{{ item }}.pub') }}"
  when:
    - hostvars[item]['is_master'] == 'yes'
    - ansible_play_batch | length > 1
    - inventory_hostname != item
  loop: "{{ ansible_play_batch }}"
  delegate_to: "{{ item }}"

- name: Disable SSH strict host key checking (non-master nodes only)
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
  when: is_master != 'yes'

- name: Add all hosts to known_hosts
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ hostvars[item].ansible_host }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -t ecdsa ' + hostvars[item].ansible_host) }}"
  loop: "{{ ansible_play_batch }}"
  when: inventory_hostname != item
