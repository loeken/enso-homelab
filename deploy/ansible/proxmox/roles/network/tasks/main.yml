---
- name: Update /etc/hosts with default IP
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^(127\.0\.1\.1)(\s+.+)$'
    line: '{{ ansible_facts.default_ipv4.address }}\2'
    backrefs: true

- name: install systemd-resolved
  ansible.builtin.apt:
    name: "systemd-resolved"
    state: "latest"

- name: Set systemd DNS configuration
  ansible.builtin.lineinfile:
    dest: "/etc/systemd/resolved.conf"
    regexp: "^DNS="
    line: "DNS=8.8.8.8 1.1.1.1"
    state: present

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    state: restarted
    name: systemd-resolved
    daemon_reload: true

- name: Add umask=0077 to vfat mounts
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(UUID=[\w-]+)\s+(/\S*)\s+(vfat)\s+(\S+)\s+(\d\s+\d)$'
    line: '\1 \2 \3 \4,umask=0077 \5'
    backrefs: yes

- name: Gather network-related facts
  ansible.builtin.setup:
    gather_subset:
      - network
