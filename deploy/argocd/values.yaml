domain: loeken.xyz
clusterIssuer: letsencrypt-prod
clusterName: enso-homelab-prod
githubUser: loeken
githubRepo: enso-homelab-prod
globalReplicaCount: 1

# app specific
authelia:
  enabled: true
  filesystem:
    enabled: true
  ingress:
    enabled: true
  smtp:
    enabled: false
    host: mail.internetz.me
    port: 587
    sender: auth@internetz.me
    username: auth@internetz.me
  storageClassName: rook-ceph-block
  size: 100Mi
certmanager:
  enabled: true
externaldns:
  enabled: true
k10:
  enabled: false
  storageClassName: rook-ceph-block
  sidecar:
    enabled: false
nginxingress:
  enabled: true
observability:
  enabled: false
  grafana:
    storageClassName: rook-ceph-block
    size: 10Gi
  prometheus:
    storageClassName: rook-ceph-block
    size: 10Gi
  alertmanager:
    storageClassName: rook-ceph-block
    size: 2Gi
  loki:
    storageClassName: rook-ceph-block
    size: 10Gi
rookceph:
  enabled: true
rookcephcluster:
  enabled: true
vaultwarden:
  enabled: true
  useAuthelia: false
  ingress:
    enabled: true
  storageClassName: rook-ceph-block
  size: 1Gi
  pg:
    storageClassName: rook-ceph-block
    size: 1Gi
whoami:
  enabled: true
