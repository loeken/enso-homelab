{{ if .Values.authelia.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: authelia
  namespace: argocd
spec:
  destination:
    namespace: authelia
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://charts.authelia.com
    targetRevision: 0.10.10
    chart: authelia
    helm:
      values: |
        domain: {{ .Values.domain }}
        image:
          repository: ghcr.io/authelia/authelia

        pod:
          replicas: {{ .Values.globalReplicaCount }}
          kind: StatefulSet
          revisionHistoryLimit: 2
          # command:
          #   - tail
          # args:
          #   - -f
          #   - /dev/null
        secret:
          disabled: true
          existingSecret: authelia
          mountPath: /secrets

          additionalSecrets:
            authelia:
              items:
                - key: identity_providers.oidc.jwks
                  path: identity_providers.oidc.jwks
                - key: identity_providers.oidc.issuer_private_key
                  path: identity_providers.oidc.issuer_private_key
                - key: session.encryption.key
                  path: session.encryption.key
                - key: storage.encryption.key
                  path: storage.encryption.key
                - key: oidc.sharedsecret.nextcloud
                  path: oidc.sharedsecret.nextcloud
                - key: oidc.sharedsecret.jellyfin
                  path: oidc.sharedsecret.jellyfin
                - key: oidc.sharedsecret.grafana
                  path: oidc.sharedsecret.grafana
        persistence:
          enabled: true
          storageClass: {{ .Values.authelia.storageClassName }}
          accessModes:
            - ReadWriteOnce
          size: {{ .Values.authelia.size }}
          mountPath: /config

        ingress:
          enabled: {{ .Values.authelia.ingress.enabled }}
          annotations:
            kubernetes.io/ingress.class: "nginx"
            cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
            external-dns.alpha.kubernetes.io/hostname: "auth.{{ .Values.domain }}."
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
            external-dns.alpha.kubernetes.io/ttl: "120"
          rulesOverride:
            - host: auth.{{ .Values.domain }}
              path: /
          tls:
            enabled: true
            secret: auth-tls

        configMap:
          log:
            level: info
          theme: dark
          authentication_backend:
            file:
              enabled: true
            password_reset:
              disable: true
          session:
            encryption_key:
              disabled: false
              secret_name: authelia
              path: session.encryption.key
            domain: {{ .Values.domain }}
            expiration: 1h
            inactivity: 5m
            cookies:
              - domain: {{ .Values.domain }}
                name: authelia_session
          storage:
            encryption_key:
              disabled: false
              secret_name: authelia
              path: /secrets/authelia/storage.encryption.key
            local:
              enabled: true
              path: /config/db.sqlite3
          notifier:
            filesystem:
              enabled: {{ .Values.authelia.filesystem.enabled }}
              filename: /config/notification.txt
            smtp:
              enabled: {{ .Values.authelia.smtp.enabled }}
              address: {{ .Values.authelia.smtp.host }}:{{ .Values.authelia.smtp.port }}
              username: {{ .Values.authelia.smtp.username }}
              sender: {{ .Values.authelia.smtp.sender }}
              identifier: {{ .Values.authelia.smtp.host }}
              startup_check_address: {{ .Values.authelia.smtp.sender }}
              subject: "[Authelia] {title}"
              tls:
                server_name: {{ .Values.authelia.smtp.host }}
                skip_verify: false
                minimum_version: TLS1.2
          identity_providers:
            oidc:
              enabled: true
              jwks:
                - algorithm: RS256
                  key:
                    path: /secrets/authelia/identity_providers.oidc.jwks
              clients:
                - client_id: grafana
                  client_name: Grafana
                  client_secret:
                    path: /secrets/authelia/oidc.sharedsecret.grafana
                  public: false
                  authorization_policy: two_factor
                  redirect_uris:
                    - https://grafana.{{ .Values.domain }}/login/generic_oauth
                  scopes:
                    - openid
                    - profile
                    - groups
                    - email
                - client_id: nextcloud
                  client_name: NextCloud
                  client_secret:
                    path: /secrets/authelia/oidc.sharedsecret.nextcloud
                  public: false
                  authorization_policy: two_factor
                  require_pkce: true
                  pkce_challenge_method: S256
                  claims_policy: nextcloud_userinfo
                  redirect_uris:
                    - https://nextcloud.{{ .Values.domain }}/apps/oidc_login/oidc
                  scopes:
                    - openid
                    - profile
                    - email
                    - groups
                  userinfo_signed_response_alg: none
                  token_endpoint_auth_method: client_secret_basic
          access_control:
            default_policy: deny
            rules:
              - domain: "*.{{ .Values.domain }}"
                policy: bypass
                networks:
                  - 10.42.0.0/16
              - domain: ['ha.{{ .Values.domain }}']
                policy: bypass
                resources:
                  - ^/api.*
                  - ^/auth/token.*
                  - ^/.external_auth=.
                  - ^/service_worker.js
                  - ^/static.*
                  - ^/local.*
                  - ^/hacsfiles.*
                  - ^/frontend_latest.*
              - domain: ['sonarr.{{ .Values.domain }}', 'radarr.{{ .Values.domain }}', 'ha.{{ .Values.domain }}']
                policy: bypass
                resources:
                  - ^/api.*
                  - ^/signalr.*
              - domain: ['vaultwarden.{{ .Values.domain }}']
                policy: bypass
                resources:
                  - ^/api.*
                  - ^/identity/connect/token.*
                  - ^/identity/accounts/prelogin.*
                  - ^/notifications/hub.*
              - domain: 'rtorrent.{{ .Values.domain }}'
                policy: bypass
                resources:
                  - ^/RPC2.*
              - domain: ['requests.{{ .Values.domain }}', 'hub.{{ .Values.domain }}']
                policy: one_factor
                subject:
                  - 'group:users'
              - domain: ['sinusbot.{{ .Values.domain }}', 'ha.{{ .Values.domain }}', 'prowlarr.{{ .Values.domain }}', 'sonarr.{{ .Values.domain }}', 'radarr.{{ .Values.domain }}', 'rtorrent.{{ .Values.domain }}', 'nzbget.{{ .Values.domain }}']
                policy: two_factor
                subject:
                  - 'group:admins'
              - domain: ['whoami.{{ .Values.domain }}', 'harbor.{{ .Values.domain }}', 'ltb-passwd.{{ .Values.domain }}', 'vaultwarden.{{ .Values.domain }}']
                policy: two_factor
                subject:
                  - 'group:users'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}