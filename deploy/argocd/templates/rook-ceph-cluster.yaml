{{ if .Values.rookcephcluster.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: rook-ceph-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph-cluster
    targetRevision: v1.17.2
    helm:
      values: |
        operatorNamespace: rook-ceph
        monitoring:
          enabled: {{ .Values.rookcephcluster.monitoring }}
          metricsDisabled: false
          createPrometheusRules: {{ .Values.rookcephcluster.createPrometheusRules }}
          rulesNamespaceOverride: rook-ceph
          prometheusRule:
            labels:
              release: prometheus
        csi:
          rbdPlugin:
            resources:
              requests:
                cpu: "100m"
                memory: "512Mi"
              limits:
                memory: "1024Mi"

          rbdProvisioner:
            resources:
              requests:
                cpu: "100m"
                memory: "512Mi"
              limits:
                memory: "1024Mi"

          cephFSPlugin:
            resources:
              requests:
                cpu: "100m"
                memory: "512Mi"
              limits:
                memory: "1024Mi"

          cephFSProvisioner:
            resources:
              requests:
                cpu: "100m"
                memory: "512Mi"
              limits:
                memory: "1024Mi"
        cephClusterSpec:
          resources:
            mgr:
              limits:
                memory: "1Gi"
              requests:
                cpu: "500m"
                memory: "512Mi"
            mon:
              limits:
                memory: "2Gi"
              requests:
                cpu: "1000m"
                memory: "1Gi"
            osd:
              limits:
                memory: "4Gi"
              requests:
                cpu: "1000m"
                memory: "4Gi"
            prepareosd:
              requests:
                cpu: "500m"
                memory: "50Mi"
            mgr-sidecar:
              limits:
                memory: "100Mi"
              requests:
                cpu: "100m"
                memory: "40Mi"
            crashcollector:
              limits:
                memory: "60Mi"
              requests:
                cpu: "100m"
                memory: "60Mi"
            logcollector:
              limits:
                memory: "1Gi"
              requests:
                cpu: "100m"
                memory: "100Mi"
            cleanup:
              limits:
                memory: "1Gi"
              requests:
                cpu: "500m"
                memory: "100Mi"
            exporter:
              limits:
                memory: "128Mi"
              requests:
                cpu: "50m"
                memory: "50Mi"

          dataDirHostPath: /var/lib/rook
          mon:
            count: 1
            allowMultiplePerNode: true
          mgr:
            count: 1
            allowMultiplePerNode: true
          dashboard:
            enabled: false
          crashCollector:
            disable: true
          logCollector:
            enabled: false
          storage:
            useAllNodes: true
            useAllDevices: true
            config:
              osdsPerDevice: "1"
              forceUseDisallowedDevice: "true"

        toolbox:
          enabled: true

        cephObjectStores: []
        cephFileSystems:
          - name: ceph-filesystem
            spec:
              metadataPool:
                replicated:
                  size: 1                  # ← adjust to 3 for production
                  requireSafeReplicaSize: false
              dataPools:
                - failureDomain: host
                  name: data0              # ← optional but recommended
                  replicated:
                    size: 1
                    requireSafeReplicaSize: false
              metadataServer:
                activeCount: 1
                activeStandby: true
                resources:
                  limits:
                    memory: "4Gi"
                  requests:
                    cpu: "1000m"
                    memory: "4Gi"
                priorityClassName: system-cluster-critical
            storageClass:
              enabled: true
              isDefault: false
              name: ceph-filesystem
              pool: data0
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: "Immediate"
              annotations: {}
              labels: {}
              mountOptions: []
              parameters:
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
                csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
                csi.storage.k8s.io/fstype: ext4
        cephBlockPools:
          - name: ceph-blockpool
            spec:
              failureDomain: host
              replicated:
                size: 1
            storageClass:
              enabled: true
              name: rook-ceph-block
              isDefault: true
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: "Immediate"
              annotations:
                storageclass.kubernetes.io/is-default-class: "true"
              parameters:
                imageFormat: "2"
                imageFeatures: layering
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
                csi.storage.k8s.io/fstype: ext4

        cephBlockPoolsVolumeSnapshotClass:
          enabled: true
          name: rook-ceph-block-snapshot
          isDefault: true
          deletionPolicy: Delete
          annotations:
            k10.kasten.io/is-snapshot-class: "true"
          parameters:
            clusterID: rook-ceph
            csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph

  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
{{ end }}
