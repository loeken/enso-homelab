{{ if .Values.nextcloud.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: nextcloud
  namespace: argocd
spec:
  destination:
    namespace: nextcloud
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: nextcloud
    helm:
      values: |
        image:
          tag: production-fpm-alpine

        nginx:
          enabled: true
          image:
            repository: nginx
            tag: alpine
            pullPolicy: IfNotPresent

        cronjob:
          enabled: true
          command:
            - /cron.sh
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 4096Mi

        internalDatabase:
          enabled: false

        externalDatabase:
          enabled: true
          type: "pgsql"
          host: nextcloud-postgresql
          port: 5432
          database: nextcloud
          existingSecret:
            enabled: true
            secretName: nextcloud
            usernameKey: postgres-username
            passwordKey: postgres-password

        postgresql:
          enabled: true
          global:
            postgresql:
              auth:
                existingSecret: nextcloud
                username: nextcloud
                database: nextcloud
                secretKeys:
                  userPasswordKey: postgres-password
                  adminPasswordKey: postgres-admin-password
                  replicationPasswordKey: postgresql-replication-password
          primary:
            persistence:
              enabled: true
              storageClass: {{ .Values.nextcloud.storageClass }}
              accessModes:
                - ReadWriteOnce

        nextcloud:
          existingSecret:
            enabled: true
            secretName: nextcloud
            usernameKey: nextcloud-username
            passwordKey: nextcloud-password
            smtpUsernameKey: smtp_username
            smtpPasswordKey: smtp_password
            smtpHostKey: smtp_host
            smtpPortKey: smtp_port
          {{- if .Values.nextcloud.useAuthelia }}
          extraEnv:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: oidc_client_secret
          {{- end }}
          host: nextcloud.{{ .Values.domain }}
          mail:
            enabled: true
            fromAddress: {{ .Values.nextcloud.smtp.sender }}
            domain: {{ .Values.nextcloud.smtp.domain }}
            smtp:
              host: {{ .Values.nextcloud.smtp.host }}
              secure: ssl
              port: {{ .Values.nextcloud.smtp.port }}
              authtype: LOGIN
          configs:
            user_oidc.config.php: |-
              <?php
              $CONFIG = [
                'user_oidc_provider_url' => 'https://auth.{{ .Values.domain }}',
                'user_oidc_client_id' => 'nextcloud',
                'user_oidc_client_secret' => getenv('OIDC_CLIENT_SECRET'),
                'allow_local_remote_servers' => true,
                'user_oidc_scope' => 'openid profile email groups',
                'user_oidc_default_group' => 'users',
                'user_oidc_login_attributes' => [
                  'id' => 'preferred_username',
                  'name' => 'name',
                  'mail' => 'email',
                  'groups' => 'groups',
                ],
                'user_oidc_auto_redirect' => false,
                'user_oidc_disable_registration' => false,
                'lost_password_link' => 'disabled',
              ];
            trusted_proxies.config.php: |-
              <?php
              $CONFIG = [
                'trusted_proxies' => array('0.0.0.0/0'),
                'forwarded_for_headers' => ['HTTP_X_FORWARDED_FOR', 'HTTP_X_REAL_IP'],
                'allow_local_remote_servers' => true,
                'overwritehost' => 'nextcloud.{{ .Values.domain }}',
                'overwriteprotocol' => 'https',
                'overwrite.cli.url' => 'https://nextcloud.{{ .Values.domain }}',
              ];
            {{- if .Values.nextcloud.useAuthelia }}
            oidc.config.php: |-
              <?php
              $CONFIG = [
                'oidc_login_provider_url' => 'https://auth.{{ .Values.domain }}',
                'oidc_login_client_id' => 'nextcloud',
                'oidc_login_client_secret' => getenv('OIDC_CLIENT_SECRET'),
                'oidc_login_auto_redirect' => false,
                'oidc_login_end_session_redirect' => false,
                'oidc_login_button_text' => 'Log in with Authelia',
                'oidc_login_hide_password_form' => false,
                'oidc_login_use_id_token' => true,
                'oidc_login_attributes' => [
                  'id' => 'preferred_username',
                  'name' => 'name',
                  'mail' => 'email',
                  'groups' => 'groups',
                ],
                'oidc_login_default_group' => 'users',
                'oidc_login_use_external_storage' => false,
                'oidc_login_scope' => 'openid profile email groups',
                'oidc_login_proxy_ldap' => false,
                'oidc_login_disable_registration' => false,
                'oidc_login_redir_fallback' => false,
                'oidc_login_tls_verify' => true,
                'lost_password_link' => 'disabled',
              ];
            {{- end }}

        ingress:
          annotations:
            cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
            external-dns.alpha.kubernetes.io/hostname: "nextcloud.{{ .Values.domain }}."
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
            external-dns.alpha.kubernetes.io/ttl: "120"
            {{- if .Values.nextcloud.useAuthelia }}
            traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd
            {{- end }}
          className: traefik
          enabled: {{ .Values.nextcloud.ingress.enabled }}
          hosts:
            - host: nextcloud.{{ .Values.domain }}
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    port: 8080
          tls:
            - secretName: nextcloud-tls
              hosts:
                - nextcloud.{{ .Values.domain }}

        persistence:
          enabled: true
          accessMode: ReadWriteOnce
          storageClass: {{ .Values.nextcloud.storageClass }}
          size: {{ .Values.nextcloud.size }}
          nextcloudData:
            enabled: true
            storageClass: {{ .Values.nextcloud.data.storageClass }}
            size: {{ .Values.nextcloud.data.size }}
            accessMode: {{ .Values.nextcloud.data.accessMode }}
    repoURL: https://nextcloud.github.io/helm/
    targetRevision: 9.1.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
{{ end }}
