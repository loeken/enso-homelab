{{ if .Values.certmanager.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # Ensure this runs after cert-manager is installed
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: cluster-issuer
  namespace: argocd
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    path: deploy/helm/cluster_issuer
    repoURL: git@github.com:{{ .Values.githubUser }}/{{ .Values.githubRepo }}.git
    targetRevision: HEAD
    helm:
      values: |
        domain: {{ .Values.domain }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
{{ end }}