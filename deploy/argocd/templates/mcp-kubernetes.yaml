{{ if .Values.mcp.kubernetes.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: mcp-kubernetes
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    path: helm-chart
    helm:
      values: |
        transport:
          mode: http
          service:
            type: ClusterIP
            port: 3001
            targetPort: 3001

        kubeconfig:
          provider: serviceaccount

        rbac:
          create: true
          useLegacyRules: true

        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m

    repoURL: https://github.com/Flux159/mcp-server-kubernetes.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
