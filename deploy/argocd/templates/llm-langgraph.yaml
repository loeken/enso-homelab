{{ if .Values.langgraph.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: llm-langgraph
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/loeken/enso-homelab
    targetRevision: HEAD
    path: deploy/helm/langgraph
    helm:
      values: |
        image:
          repository: {{ .Values.langgraph.image.repository }}
          tag: "{{ .Values.langgraph.image.tag }}"
        env:
          LITELLM_API_BASE: "http://llm-litellm.llm.svc.cluster.local:4000/v1"
          MCPO_BASE_URL: "http://mcp-servers-mcpo.llm.svc.cluster.local:8000"
          MCP_SERVERS: "grafana,kubernetes,github,postgres,fetch"
          DEFAULT_MODEL: "default"
        ingress:
          enabled: {{ .Values.langgraph.ingress.enabled }}
          {{- if .Values.langgraph.ingress.enabled }}
          useAuthelia: {{ .Values.langgraph.ingress.useAuthelia }}
          hostname: langgraph.{{ .Values.domain }}
          clusterIssuer: {{ .Values.clusterIssuer }}
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
