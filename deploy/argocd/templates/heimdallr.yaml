{{ if .Values.heimdallr.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: heimdallr
  namespace: argocd
spec:
  destination:
    namespace: heimdallr
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: generic_service
    helm:
      values: |
        controllers:
          main:
            enabled: true
            type: deployment
            containers:
              main:
                image:
                  # -- image repository
                  repository: loeken/heimdallr
                  # -- image tag
                  # @default -- chart.appVersion
                  tag: "latest"
                  # -- image pull policy
                  pullPolicy: Always
                # -- environment variables.
                # @default -- See below
                env:
                  # -- Set the container timezone
                  TZ: UTC
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: "10m"
                    memory: 128Mi
        service:
          main:
            controller: main
            ports:
              http:
                port: 8000

        ingress:
          main:
            enabled: {{ .Values.heimdallr.ingress.enabled }}
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "heimdallr.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.heimdallr.useAuthelia }}
              nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
              nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
              {{end}}
            className: "nginx"
            hosts:
              - host: heimdallr.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      name: heimdallr
                      port: 8000
            tls:
            - secretName: heimdallr-tls
              hosts:
              - heimdallr.{{ .Values.domain }}
        postgresql:
          enabled: true
          auth:
            username: postgres
            database: heimdallr
            existingSecret: heimdallr
            secretKeys:
              userPasswordKey: POSTGRES_PASSWORD
              adminPasswordKey: POSTGRES_ADMIN_PASSWORD
          primary:
            persistence:
              enabled: true
              storageClass: {{ .Values.homeassistant.storageClass }}
              accessModes:
                - ReadWriteOnce
    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
{{ end }}