{{ if .Values.heimdallr.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: heimdallr
  namespace: argocd
spec:
  destination:
    namespace: heimdallr
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: generic_service
    helm:
      values: |
        controllers:
          main:
            enabled: true
            type: deployment
            initContainers:
              wait-for-postgres:
                image:
                  repository: bitnami/postgresql
                  tag: "16"
                  pullPolicy: IfNotPresent
                command:
                  - /bin/bash
                  - -c
                  - |
                    echo "🔄 Waiting for PostgreSQL to be ready..."
                    until PGPASSWORD="$POSTGRES_PASSWORD" pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                      echo "PostgreSQL not ready, waiting..."
                      sleep 2
                    done
                    echo "✅ PostgreSQL is ready."
                env:
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_USER
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_PASSWORD
                  - name: POSTGRES_HOST
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_HOST
                  - name: POSTGRES_PORT
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_PORT
            containers:
              main:
                image:
                  # -- image repository
                  repository: loeken/heimdallr
                  # -- image tag
                  # @default -- chart.appVersion
                  tag: "latest"
                  # -- image pull policy
                  pullPolicy: Always
                # -- environment variables.
                # @default -- See below
                env:
                  - name: TZ
                    value: UTC
                  - name: PORT
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: PORT
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_USER
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_PASSWORD
                  - name: POSTGRES_DB
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_DB
                  - name: POSTGRES_PORT
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_PORT
                  - name: POSTGRES_HOST
                    valueFrom:
                      secretKeyRef:
                        name: heimdallr
                        key: POSTGRES_HOST
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: "10m"
                    memory: 128Mi
        service:
          main:
            controller: main
            ports:
              http:
                port: 8000
        serviceMonitor:
          enabled: true
          interval: 30s
          path: /metrics
          labels:
            release: prometheus
        ingress:
          main:
            enabled: {{ .Values.heimdallr.ingress.enabled }}
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "heimdallr.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.heimdallr.useAuthelia }}
              nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
              nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
              {{end}}
            className: "nginx"
            hosts:
              - host: heimdallr.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      name: heimdallr
                      port: 8000
            tls:
            - secretName: heimdallr-tls
              hosts:
              - heimdallr.{{ .Values.domain }}
        postgresql:
          enabled: true
          auth:
            username: heimdallr
            database: heimdallr
            existingSecret: heimdallr
            secretKeys:
              userPasswordKey: POSTGRES_PASSWORD
              adminPasswordKey: POSTGRES_ADMIN_PASSWORD
          primary:
            persistence:
              enabled: true
              storageClass: {{ .Values.homeassistant.storageClass }}
              accessModes:
                - ReadWriteOnce
    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
{{ end }}