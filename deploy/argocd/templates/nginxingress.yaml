apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: nginx-ingress
  namespace: argocd
spec:
  destination:
    namespace: nginx-ingress
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    path: 'nginx-ingress-controller'
    targetRevision: 11.6.7
    chart: nginx-ingress-controller
    helm:
      values: |
        kind: DaemonSet
        daemonset:
          useHostPort: true
          hostPorts:
            http: 80
            https: 443
        service:
          externalTrafficPolicy: Local
          type: NodePort

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
