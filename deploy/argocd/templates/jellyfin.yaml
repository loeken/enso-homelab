{{ if .Values.jellyfin.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: jellyfin
  namespace: argocd
spec:
  destination:
    namespace: media
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: jellyfin
    helm:
      values: |
        controllers:
          main:
            containers:
              main:
                env:
                  TZ: UTC
                  # OIDC Configuration via environment variables
                  JELLYFIN_OIDC_ISSUER: https://auth.{{ .Values.domain }}
                  JELLYFIN_OIDC_CLIENT_ID: jellyfin
                  JELLYFIN_OIDC_REDIRECT_URI: https://jellyfin.{{ .Values.domain }}/sso/OID/redirect/authelia
                  JELLYFIN_OIDC_SCOPES: "openid profile email groups"
                envFrom:
                  - secretRef:
                      name: jellyfin-oidc-config
        persistence:
          config:
            enabled: {{ .Values.jellyfin.config.enabled }}
            accessMode: ReadWriteOnce
            size: {{ .Values.jellyfin.config.size }}
            storageClass: {{ .Values.jellyfin.config.storageClass }}
          cache:
            enabled: {{ .Values.jellyfin.cache.enabled }}
            size: {{ .Values.jellyfin.cache.size }}
            storageClass: {{ .Values.jellyfin.cache.storageClass }}
            accessMode: ReadWriteOnce
          media:
            enabled: {{ .Values.sharedmedia.enabled }}
            type: persistentVolumeClaim
            existingClaim: shared-media
          devdri:
            enabled: true
            type: hostPath
            hostPath: /dev/dri
            hostPathType: Directory
            advancedMounts:
              main:
                main:
                  - path: /dev/dri
        ingress:
          main:
            enabled: {{ .Values.jellyfin.ingress.enabled }}
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "jellyfin.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.jellyfin.useAuthelia }}
              nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
              nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
              {{end}}
            className: "nginx"
            hosts:
              - host: jellyfin.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      name: jellyfin
                      port: 8096
            tls:
            - secretName: jellyfinserver-tls
              hosts:
              - jellyfin.{{ .Values.domain }}

    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 10.10.7
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
{{ end }}