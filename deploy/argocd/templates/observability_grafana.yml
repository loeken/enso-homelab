apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 9.0.0
    helm:
      values: |
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password

        persistence:
          enabled: true
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          size: 5Gi
        grafana.ini:
          server:
            root_url: https://grafana{{ .Values.domain }}
            domain: aneralabs.lan
          users:
            auto_assign_org_role: Editor
        envFromSecret: grafana-oauth-config
        plugins:
          - ae3e-plotly-panel
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
            external-dns.alpha.kubernetes.io/hostname: "grafana.{{ .Values.domain }}."
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
            external-dns.alpha.kubernetes.io/ttl: "120"
          hosts:
            - grafana.{{ .Values.domain }}
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.{{ .Values.domain }}

        sidecar:
          dashboards:
            enabled: false
          datasources:
            enabled: true

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                type: loki
                access: proxy
                url: http://observability-loki:3100
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://kube-prometheus-stack-prometheus:9090
                isDefault: true
        hostAliases:
          - ip: "10.1.0.101"
            hostnames:
              - "auth{{ .Values.domain }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
