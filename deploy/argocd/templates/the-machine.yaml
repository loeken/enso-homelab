{{ if .Values.theMachine.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-machine
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: the-machine
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: git@github.com:loeken/the-machine
    path: deploy/helm/the-machine
    targetRevision: HEAD
    helm:
      values: |
        clickhouse:
          storage:
            storageClass: {{ .Values.theMachine.storageClass }}
            size: {{ .Values.theMachine.clickhouse.storage.size }}
        controllers:
          redis:
            persistence:
              data:
                storageClass: {{ .Values.theMachine.storageClass }}
          migrator:
            enabled: false
          migrator-{{ .Values.theMachine.images.migrate | replace "." "-" }}:
            type: job
            containers:
              main:
                image:
                  repository: ghcr.io/loeken/the-machine-migrate
                  tag: {{ .Values.theMachine.images.migrate }}
                  pullPolicy: IfNotPresent
                args:
                  - -addr
                  - chi-the-machine-main-0-0:9000
                  - -db
                  - default
                  - -user
                  - $(CLICKHOUSE_USER)
                  - -password
                  - $(CLICKHOUSE_PASSWORD)
                env:
                  CLICKHOUSE_USER:
                    valueFrom:
                      secretKeyRef:
                        name: the-machine
                        key: CLICKHOUSE_USER
                  CLICKHOUSE_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: the-machine
                        key: CLICKHOUSE_PASSWORD
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
          collector-forex-daily:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.collector }}
          collector-forex-hourly:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.collector }}
          collector-cryptocompare:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.collector }}
          collector-twitter:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.collector }}
          collector-reddit:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.collector }}
          collector-binance:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.collector }}
          normalizer:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.normalizer }}
          analyzer-statistical:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.analyzer }}
          analyzer-semantic:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.analyzer }}
          correlator:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.correlator }}
          alerter:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.alerter }}
          trader-ingestion:
            containers:
              main:
                image:
                  tag: {{ .Values.theMachine.images.traderIngestion }}
        {{- if .Values.theMachine.ingress.enabled }}
        ingress:
          trader-ingestion:
            enabled: true
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "the-machine.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/ttl: "120"
            hosts:
              - host: the-machine.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: trader-ingestion
                      port: http
            tls:
              - secretName: the-machine-tls
                hosts:
                  - the-machine.{{ .Values.domain }}
        {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
