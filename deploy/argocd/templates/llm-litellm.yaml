{{ if .Values.litellm.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: llm-litellm
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: litellm-helm
    repoURL: ghcr.io/berriai
    targetRevision: 1.82.6-nightly-latest
    helm:
      values: |
        replicaCount: 1

        service:
          type: ClusterIP
          port: 4000

        masterkeySecretName: litellm
        masterkeySecretKey: LITELLM_MASTER_KEY

        proxy_config:
          model_list:
            - model_name: default
              litellm_params:
                model: openai/Qwen/Qwen3-14B-AWQ
                api_base: "http://{{ .Values.llmHostIP }}:8000/v1"
                api_key: "dummy"
              model_info:
                supports_function_calling: true
            - model_name: qwen3-14b
              litellm_params:
                model: openai/Qwen/Qwen3-14B-AWQ
                api_base: "http://{{ .Values.llmHostIP }}:8000/v1"
                api_key: "dummy"
              model_info:
                supports_function_calling: true
            - model_name: ollama/llama3
              litellm_params:
                model: ollama/llama3
                api_base: "http://{{ .Values.llmHostIP }}:11434"
            - model_name: nomic-embed-text
              litellm_params:
                model: ollama/nomic-embed-text
                api_base: "http://{{ .Values.llmHostIP }}:11434"
          litellm_settings:
            set_verbose: true
            json_logs: true
            store_prompts_in_spend_logs: true

        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: 2000m

        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
            external-dns.alpha.kubernetes.io/hostname: "litellm.{{ .Values.domain }}."
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
            external-dns.alpha.kubernetes.io/ttl: "120"
          className: "nginx"
          hosts:
            - host: litellm.{{ .Values.domain }}
              paths:
                - path: /
                  pathType: ImplementationSpecific
          tls:
            - secretName: litellm-tls
              hosts:
                - litellm.{{ .Values.domain }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
