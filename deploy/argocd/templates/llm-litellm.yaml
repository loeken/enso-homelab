{{ if .Values.litellm.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: llm-litellm
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: litellm-helm
    helm:
      values: |
        replicaCount: 1

        service:
          type: ClusterIP
          port: 4000

        masterkeySecretName: litellm
        masterkeySecretKey: LITELLM_MASTER_KEY

        proxy_config:
          model_list:
            - model_name: default
              litellm_params:
                model: openai/Qwen/Qwen3-14B-AWQ
                api_base: "http://{{ .Values.llmHostIP }}:8000/v1"
                api_key: "dummy"
            - model_name: qwen3-14b
              litellm_params:
                model: openai/Qwen/Qwen3-14B-AWQ
                api_base: "http://{{ .Values.llmHostIP }}:8000/v1"
                api_key: "dummy"
            - model_name: ollama/llama3
              litellm_params:
                model: ollama/llama3
                api_base: "http://{{ .Values.llmHostIP }}:11434"
            - model_name: nomic-embed-text
              litellm_params:
                model: ollama/nomic-embed-text
                api_base: "http://{{ .Values.llmHostIP }}:11434"
          litellm_settings:
            drop_params: true

          mcp_servers:
            #kubernetes:
            #  url: "http://mcp-kubernetes.llm.svc.cluster.local:8080/mcp"
            #  transport: streamable_http
            grafana:
              url: "http://mcp-grafana-grafana-mcp.llm.svc.cluster.local:8000/sse"
              transport: sse
            #servers:
            #  url: "http://mcp-servers.llm.svc.cluster.local:8000/mcp"
            #  transport: streamable_http

        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: 2000m

    repoURL: ghcr.io/berriai
    targetRevision: 1.82.6-nightly-latest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
