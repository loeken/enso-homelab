{{ if .Values.observability.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: observability-kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.5
    helm:
      skipCrds: true
      values: |
        fullnameOverride: kube-prometheus-stack

        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 14d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: {{ .Values.observability.prometheus.storageClassName }}
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: {{ .Values.observability.prometheus.size }}
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "prometheus.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.observability.useAuthelia }}
              traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd
              {{- end }}
            hosts:
              - prometheus.{{ .Values.domain }}
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.{{ .Values.domain }}

        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            receivers:
              - name: 'pagerduty'
                pagerduty_configs:
                  - service_key: ''
                    service_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/service_key
                    send_resolved: true
              - name: 'robusta'
                webhook_configs:
                  - url: 'http://observability-robusta-runner.observability.svc.cluster.local/api/alerts'
                    send_resolved: true
              - name: 'default-receiver'
            route:
              routes:
                - receiver: 'pagerduty'
                  group_by: [ 'alertname' ]
                  matchers:
                    - severity = "critical"
                  group_wait: 10s
                  group_interval: 5m
                  repeat_interval: 1h
                - receiver: 'robusta'
                  group_by: [ '...' ]
                  group_wait: 1s
                  group_interval: 1s
                  matchers:
                    - severity =~ ".*"
                  repeat_interval: 4h
                  continue: true
              receiver: 'default-receiver'
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: {{ .Values.observability.alertmanager.storageClassName }}
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: {{ .Values.observability.alertmanager.size  }}
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "alertmanager.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.observability.useAuthelia }}
              traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd
              {{- end }}
            hosts:
              - alertmanager.{{ .Values.domain }}
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.{{ .Values.domain }}

        grafana:
          enabled: false

        defaultRules:
          create: true

        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: true
        nodeExporter:
          enabled: true
        kubeStateMetrics:
          enabled: true
        kubelet:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}