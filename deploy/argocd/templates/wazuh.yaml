apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh-full-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://morgoved.github.io/wazuh-helm/
    targetRevision: v0.1.4
    chart: wazuh
    helm:
      releaseName: wazuh
      values: |
        global:
          createNamespace: true

        manager:
          enabled: true

        indexer:
          enabled: true

        dashboard:
          enabled: true
          ingress:
            enabled: true
            className: nginx
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: letsencrypt-prod
              external-dns.alpha.kubernetes.io/hostname: dashboard.{{ .Values.domain }}
            hosts:
              - host: dashboard.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: wazuh-dashboard-tls
                hosts:
                  - dashboard.{{ .Values.domain }}

        certs:
          enabled: true

        agent:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: wazuh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
