{{ if .Values.sonarr.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: sonarr
  namespace: argocd
spec:
  destination:
    namespace: media
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: sonarr
    helm:
      values: |
        persistence:
          config:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: {{ .Values.sonarr.config.storageClass }}
            size: {{ .Values.sonarr.config.size }}
            readOnly: false
          media:
            enabled: true
            accessMode: ReadWriteMany
            size: {{ .Values.sharedmedia.size }}
            storageClass: {{ .Values.sharedmedia.storageClass }}
            existingClaim: shared-media
        ingress:
          main:
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "sonarr.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.sonarr.useAuthelia }}
              traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd
              {{end}}
            className: "traefik"
            enabled: {{ .Values.sonarr.ingress.enabled }}
            hosts:
              - host: sonarr.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      port: 8989
            tls:
            - secretName: sonarr-tls
              hosts:
              - sonarr.{{ .Values.domain }}
        probes:
          startup:
            spec:
              initialDelaySeconds: 20
    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 4.0.17
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

{{ end }}