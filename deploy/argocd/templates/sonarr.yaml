{{ if .Values.sonarr.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: sonarr
  namespace: argocd
spec:
  destination:
    namespace: media
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: sonarr
    helm:
      values: |
        controllers:
          main:
            enabled: true
            type: deployment
            containers:
              main:
                image:
                  # -- image repository
                  repository: loeken/sonarr
                  # @default -- chart.appVersion
                  tag: 4.0.14
                  # -- image pull policy
                  pullPolicy: IfNotPresent

                # -- environment variables.
                # @default -- See below
                env:
                  # -- Set the container timezone
                  TZ: UTC
                # default limits
                resources:
                  limits:
                    cpu: "1"
                    memory: 512Mi
                  requests:
                    cpu: "0.5"
                    memory: 256Mi

        service:
          main:
            enabled: true
            controller: main
            type: ClusterIP
            ports:
              http:
                enabled: true
                port: 8989
                protocol: TCP
                primary: true

        persistence:
          config:
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: {{ .Values.sonarr.config.storageClass }}
            size: {{ .Values.sonarr.config.size }}
            readOnly: false
          media:
            enabled: true
            accessMode: ReadWriteMany
            size: {{ .Values.sharedmedia.size }}
            storageClass: {{ .Values.sharedmedia.storageClass }}
            existingClaim: shared-media
        ingress:
          main:
            annotations:
              kubernetes.io/ingress.class: "nginx"
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "sonarr.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.sonarr.useAuthelia }}
              nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
              nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
              {{end}}
            enabled: {{ .Values.sonarr.ingress.enabled }}
            hosts:
              - host: sonarr.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      port: 8989
            tls:
            - secretName: sonarr-tls
              hosts:
              - sonarr.{{ .Values.domain }}
        probes:
          startup:
            spec:
              initialDelaySeconds: 20
    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 4.0.14
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

{{ end }}