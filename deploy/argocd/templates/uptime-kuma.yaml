apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: uptime-kuma
  namespace: argocd
spec:
  destination:
    namespace: uptime-kuma
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: uptime-kuma
    helm:
      values: |
        persistence:
          data:
            enabled: true
            accessMode: ReadWriteOnce
            size: {{ .Values.uptimekuma.size }}
            storageClass: {{ .Values.uptimekuma.storageClassName }}
            advancedMounts:
              main:
                main:
                  - path: /app/data
                    readOnly: false
        service:
          main:
            controller: main
            ports:
              http:
                port: 3001
        ingress:
          main:
            enabled: {{ .Values.uptimekuma.enabled }}
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "status.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.uptimekuma.useAuthelia }}
              nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
              nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
              traefik.ingress.kubernetes.io/router.middlewares: default-authelia-forwardauth@kubernetescrd
              {{- end }}
            className: "traefik"
            hosts:
              - host: status.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: ImplementationSpecific
                    service:
                      name: uptime-kuma
                      port: 3001
            tls:
              - secretName: uptime-kumaserver-tls
                hosts:
                  - status.{{ .Values.domain }}

    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 2.3.2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
