{{ if .Values.sinusbot.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: sinusbot
  namespace: argocd
spec:
  destination:
    namespace: media
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: sinusbot
    helm:
      values: |
        persistence:
          sinusbot:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: {{ .Values.sinusbot.config.size }}
            storageClass: {{ .Values.sinusbot.config.storageClass }}
            advancedMounts:
              main:              # controller name
                main:            # container name
                  - path: /opt/sinusbot/data
                    subPath: data
                  - path: /opt/sinusbot/scripts
                    subPath: scripts
        ingress:
          main:
            enabled: {{ .Values.sinusbot.ingress.enabled }}
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "sinusbot.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              {{- if .Values.sinusbot.useAuthelia }}
              nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
              nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
              {{end}}
              nginx.ingress.kubernetes.io/proxy-body-size: "128m"
            className: "nginx"
            hosts:
              - host: sinusbot.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      port: 8087
                      name: sinusbot
            tls:
            - secretName: sinusbotserver-tls
              hosts:
              - sinusbot.{{ .Values.domain }}
    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 2.3.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

{{ end }}