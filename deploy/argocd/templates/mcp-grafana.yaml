{{ if .Values.mcp.grafana.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: mcp-grafana
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: grafana-mcp
    helm:
      values: |
        grafana:
          url: "http://observability-grafana.observability.svc.cluster.local"
          apiKeySecret:
            name: mcp-grafana
            key: GRAFANA_API_KEY

        service:
          type: ClusterIP
          port: 8000

        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m

    repoURL: ghcr.io/grafana-community/helm-charts
    targetRevision: 0.9.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
