{{ if .Values.openwebui.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: llm-open-webui
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: open-webui
    helm:
      values: |
        replicaCount: 1

        # Disable bundled Ollama — we use our external LiteLLM router
        ollama:
          enabled: false

        openaiBaseApiUrl: "http://litellm.llm.svc.cluster.local:4000/v1"
        defaultOpenAiApiKey: "EMPTY"

        # Point at LiteLLM on the GPU host
        extraEnvVars:
          - name: WEBUI_AUTH
            value: "true"
          - name: WEBUI_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: open-webui
                key: WEBUI_SECRET_KEY
          - name: VECTOR_DB
            value: "qdrant"
          - name: QDRANT_URL
            value: "http://qdrant.llm.svc.cluster.local:6333"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: llm-postgresql-cluster-app
                key: uri

        persistence:
          enabled: true
          size: {{ .Values.openwebui.storageSize }}
          storageClass: {{ .Values.openwebui.storageClassName }}

        service:
          type: ClusterIP
          port: 8080

        ingress:
          enabled: {{ .Values.openwebui.enabled }}
          annotations:
            cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
            external-dns.alpha.kubernetes.io/hostname: "ai.{{ .Values.domain }}."
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
            external-dns.alpha.kubernetes.io/ttl: "120"
            {{- if .Values.openwebui.useAuthelia }}
            nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
            nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
            {{- end }}
          class: "nginx"
          host: ai.{{ .Values.domain }}
          tls: true
          existingSecret: open-webui-tls

    repoURL: https://helm.openwebui.com
    targetRevision: 6.4.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
