{{ if .Values.vaultwarden.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: vaultwarden
  namespace: argocd
spec:
  destination:
    namespace: vaultwarden
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: vaultwarden
    helm:
      values: |
        controllers:
          main:
            enabled: true
            type: deployment
            containers:
              main:
                image:
                  # -- image repository
                  repository: loeken/vaultwarden
                  # -- image tag
                  # @default -- chart.appVersion
                  tag: "1.34.1-alpine"
                  # -- image pull policy
                  pullPolicy: Always
                # -- environment variables.
                # @default -- See below
                env:
                  # -- Set the container timezone
                  - name: TZ
                    value: UTC
                envFrom:
                - secretRef:
                    name: vaultwarden
        service:
          main:
            controller: main
            ports:
              http:
                port: 80
              websocket:
                enabled: true
                port: 3012
        ingress:
          main:
            annotations:
              cert-manager.io/cluster-issuer: "{{ .Values.clusterIssuer }}"
              external-dns.alpha.kubernetes.io/hostname: "vaultwarden.{{ .Values.domain }}."
              external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
              external-dns.alpha.kubernetes.io/ttl: "120"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
              {{- if .Values.vaultwarden.useAuthelia }}
              nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
              nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.domain }}"
              {{- end }}
            enabled: {{ .Values.vaultwarden.ingress.enabled }}
            className: "nginx"
            hosts:
              - host: vaultwarden.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      port: 80
                      name: vaultwarden
            tls:
            - secretName: vaultwarden-tls
              hosts:
              - vaultwarden.{{ .Values.domain }}
        persistence:
          config:
            enabled: true
            storageClass: {{ .Values.vaultwarden.storageClassName }}
            accessMode: ReadWriteOnce
            size: {{ .Values.vaultwarden.size }}
        postgresql:
          enabled: true
          global:
            postgresql:
              auth:
                database: vaultwarden
                username: vaultwarden
                existingSecret: vaultwarden
                secretKeys:
                  adminPasswordKey: "pgadminpass"
                  userPasswordKey: "pguserpass"
          primary:
            persistence:
              enabled: true
              storageClass: {{ .Values.vaultwarden.pg.storageClassName }}
              size: {{ .Values.vaultwarden.pg.size }}
              accessModes:
                - ReadWriteOnce
        
    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 1.34.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

{{ end }}
