{{ if .Values.qdrant.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: llm-qdrant
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: qdrant
    helm:
      values: |
        replicaCount: 1
        persistence:
          accessModes:
            - ReadWriteOnce
          size: {{ .Values.qdrant.storageSize }}
          storageClassName: {{ .Values.qdrant.storageClassName }}
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
        service:
          type: ClusterIP
          port: 6333
          grpcPort: 6334
        metrics:
          serviceMonitor:
            enabled: false
    repoURL: https://qdrant.github.io/qdrant-helm
    targetRevision: 1.14.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
