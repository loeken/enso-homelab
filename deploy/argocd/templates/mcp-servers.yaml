{{ if .Values.mcpservers.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: mcp-servers
  namespace: argocd
spec:
  destination:
    namespace: llm
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: mcp-servers
    helm:
      values: |
        ingress:
          main:
            enabled: {{ .Values.mcpservers.ingress.enabled }}
            className: "nginx"
            hosts:
              - host: mcp-grafana.{{ .Values.domain }}
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      name: mcp-servers-main
                      port: 8000
            tls:
              - secretName: mcp-grafana-tls
                hosts:
                  - mcp-grafana.{{ .Values.domain }}
        service:
          main:
            enabled: true
            controller: main
            type: ClusterIP
            ports:
              http:
                enabled: true
                port: 8000
                protocol: TCP
                primary: true
    repoURL: https://loeken.github.io/helm-charts
    targetRevision: 0.1.0 # <-- set your released version/tag
    path: charts/mcp-servers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{ end }}
