apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 8.0.15
    - repoURL: git@github.com:loeken/enso-homelab-prod
      targetRevision: HEAD
      ref: values
  source:
    helm:
      valueFiles:
        - $values/deploy/helm/cluster_issuer/argocd-values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
