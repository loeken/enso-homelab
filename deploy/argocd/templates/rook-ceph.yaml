{{ if .Values.rookceph.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: rook-ceph
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: v1.19.2
    helm:
      values: |
        crds:
          enabled: true
        monitoring:
          enabled: {{ .Values.rookceph.monitoring }}
        csi:
          csiRBDProvisionerResource: |
            - name: csi-provisioner
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-resizer
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-attacher
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-snapshotter
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-rbdplugin
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-omap-generator
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: liveness-prometheus
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi

          csiRBDPluginResource: |
            - name: driver-registrar
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-rbdplugin
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: liveness-prometheus
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi

          csiCephFSProvisionerResource: |
            - name: csi-provisioner
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-resizer
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-attacher
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-snapshotter
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-cephfsplugin
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: liveness-prometheus
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi

          csiCephFSPluginResource: |
            - name: driver-registrar
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: csi-cephfsplugin
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi
            - name: liveness-prometheus
              resource:
                requests:
                  memory: 100Mi
                  cpu: 10m
                limits:
                  memory: 100Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
{{ end }}