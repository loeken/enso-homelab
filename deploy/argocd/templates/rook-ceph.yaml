apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    targetRevision: v1.14.3
    chart: rook-ceph
    helm:
      values: |
        crds:
          enabled: true

        csi:
          enableCephFS: true
          enableRBD: true
          enableCSIHostNetwork: true
          provisionerTolerations:
            - operator: Exists
          pluginTolerations:
            - operator: Exists

        monitoring:
          enabled: false

        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
