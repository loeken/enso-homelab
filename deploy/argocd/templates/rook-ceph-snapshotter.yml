{{ if .Values.rookceph.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4" 
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: snapshot-controller
  namespace: argocd
spec:
  destination:
    namespace: rook-ceph
    server: https://kubernetes.default.svc
  project: default
  source:
    path: deploy/helm/snapshot-controller
    repoURL: https://github.com/loeken/enso-homelab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
{{ end }}