apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-langgraph
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-langgraph
  template:
    metadata:
      labels:
        app: llm-langgraph
    spec:
      containers:
        - name: agent
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langgraph
                  key: LITELLM_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-postgresql-cluster-app
                  key: uri
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: llm-langgraph
  namespace: llm
spec:
  selector:
    app: llm-langgraph
  ports:
    - port: 8000
      targetPort: 8000
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-langgraph
  namespace: llm
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.hostname | quote }}
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "120"
    {{- if .Values.ingress.useAuthelia }}
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/auth-request"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.ingress.hostname | splitList "." | rest | join "." }}"
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-langgraph
                port:
                  number: 8000
  tls:
    - secretName: langgraph-tls
      hosts:
        - {{ .Values.ingress.hostname }}
{{- end }}
